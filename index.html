고루 입히고, 그릇에 담아 바로 내거나 밀폐용기에 1인분씩 나눠 담아 냉장 4일 이내로 보관한다."],"source":"https://www.youtube.com/results?search_query=%EC%8B%9C%ED%8A%B8%ED%8C%AC%20%EC%86%8C%EC%8B%9C%EC%A7%80%20%EA%B0%90%EC%9E%90%20%EA%B5%AC%EC%9D%B4%20%EB%A0%88%EC%8B%9C%ED%94%BC","sourceName":"YouTube 검색","tags":["시트팬","소시지","감자","간편"],"servings":4,"storageInfo":"냉장 보관 4~5일, 전자레인지 또는 에어프라이어 재가열"},{"name":"참치마요 덮밥","category":"additional","displayCategory":"korean","type":"one-pan","ingredients":["참치캔 2개","양파 1개","옥수수 통조림 1/2개","마요네즈 3큰술","간장 1큰술","설탕 1/2큰술","김가루 1큰술","달걀 4개","밥 4인분","참기름 1작은술"],"cookTime":15,"difficulty":"쉬움","calories":480,"protein":24,"steps":["양파 1개는 0.3cm 크기로 잘게 다지고, 참치캔 2개와 옥수수 통조림 1/2개는 체에 받쳐 기름과 물을 5분간 완전히 뺀다.","달군 팬에 식용유 1작은술을 두르고 중불에서 다진 양파를 넣어 가장자리가 투명해질 때까지 2분간 볶는다.","기름 뺀 참치와 옥수수를 넣고 1분간 풀어가며 볶다가 간장 1큰술과 설탕 1/2큰술을 넣어 수분이 거의 사라질 때까지 1~2분 더 볶고 불을 끈다.","한 김 식힌 뒤 마요네즈 3큰술을 넣고 골고루 섞어 부드러운 참치마요를 완성한다(뜨거울 때 넣으면 마요가 분리된다).","다른 팬에 식용유 1큰술을 두르고 약불에서 달걀 4개를 하나씩 깨 넣어 흰자가 굳고 노른자는 반숙이 될 때까지 한 면당 2분간 부친다.","보관 용기 또는 그릇에 밥 4인분을 1공기씩 담고 참치마요를 1/4씩 듬뿍 올린다.","그 위에 달걀프라이를 얹고 김가루 1큰술과 참기름 1작은술을 골고루 뿌려 완성한다.","냉장 보관 시 2일 이내로 섭취하고, 달걀프라이는 따로 보관했다가 먹기 직전 부쳐 올리면 더 맛있다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%B0%B8%EC%B9%98%EB%A7%88%EC%9A%94%20%EB%8D%AE%EB%B0%A5","sourceName":"만개의레시피 검색","tags":["원팬","참치","덮밥","초간단","자취"],"servings":4,"storageInfo":"냉장 보관 2~3일, 달걀은 당일 조리 권장"},{"name":"소고기 볶음우동","category":"additional","displayCategory":"asian","type":"one-pan","ingredients":["소고기 채끝 300g","우동면 4인분","양배추 1/4통","양파 1개","당근 1/2개","대파 1대","간장 3큰술","굴소스 2큰술","설탕 1큰술","참기름 1큰술","후추 1꼬집","식용유 2큰술"],"cookTime":20,"difficulty":"쉬움","calories":460,"protein":26,"steps":["소고기 채끝 300g은 결 반대 방향으로 0.3cm 두께로 얇게 썰어 볼에 담고 간장 1큰술, 후추 1꼬집을 넣어 손으로 가볍게 주물러 10분간 재운다.","양배추 1/4통은 1cm 폭으로 채 썰고, 양파 1개는 0.5cm 두께로 채 썰며, 당근 1/2개는 0.3cm 두께로 채 썬다. 대파 1대는 어슷썰기 한다.","작은 볼에 간장 2큰술, 굴소스 2큰술, 설탕 1큰술을 넣고 설탕이 녹을 때까지 섞어 양념장을 만든다.","우동면 4인분은 끓는 물에 1분간 살짝 데쳐 면을 풀고 찬물에 가볍게 헹궈 체에 밭쳐둔다.","달군 팬에 식용유 1큰술을 두르고 강불에서 소고기를 한 겹으로 펼쳐 1분 30초간 빠르게 볶다가 색이 80% 변하면 접시에 덜어둔다.","같은 팬에 식용유 1큰술을 추가해 양파와 당근을 강불에서 1분간 볶고, 양배추를 넣어 1분 30초 더 볶아 숨이 살짝 죽게 한다.","데친 우동면을 넣고 양념장을 둘러 부은 뒤 강불에서 2분간 빠르게 볶아 면에 양념이 골고루 입혀지게 한다.","볶아둔 소고기를 다시 넣어 30초간 섞은 뒤 불을 끄고 참기름 1큰술과 어슷썬 대파를 올려 잔열로 향을 살린다.","그릇에 1인분씩 담아 바로 내거나, 밀폐용기에 나눠 담아 냉장 2일 이내로 섭취한다."],"source":"https://www.youtube.com/results?search_query=%EC%86%8C%EA%B3%A0%EA%B8%B0%20%EB%B3%B6%EC%9D%8C%EC%9A%B0%EB%8F%99%20%EB%A0%88%EC%8B%9C%ED%94%BC","sourceName":"YouTube 검색","tags":["원팬","우동","소고기","볶음면"],"servings":4,"storageInfo":"냉장 보관 3일, 면이 불지 않도록 소스와 분리 보관"},{"name":"치킨 데리야끼 볶음면","category":"additional","displayCategory":"asian","type":"one-pan","ingredients":["닭다리살 400g","소바면 300g","양배추 1/4통","당근 1/2개","대파 2대","간장 3큰술","미림 2큰술","올리고당 2큰술","다진마늘 1큰술","생강가루 1/4작은술","식용유 2큰술","깨소금 1작은술"],"cookTime":25,"difficulty":"보통","calories":470,"protein":28,"steps":["닭다리살 400g은 키친타월로 물기를 닦고 한입 크기(2.5cm)로 자른 뒤 볼에 담아 간장 1큰술과 생강가루 1/4작은술을 넣어 손으로 주물러 10분간 재운다.","양배추 1/4통은 2cm 폭으로 큼직하게 썰고, 당근 1/2개는 0.3cm 두께로 어슷 썰며, 대파 2대는 4cm 길이로 잘라둔다.","작은 볼에 간장 2큰술, 미림 2큰술, 올리고당 2큰술, 다진마늘 1큰술을 넣고 골고루 섞어 데리야끼 소스를 만든다.","냄비에 물을 충분히 끓여 소바면 300g을 포장 안내대로 4~5분간 삶고, 찬물에 30초간 헹궈 전분기를 뺀 뒤 체에 밭쳐 물기를 뺀다.","달군 팬에 식용유 1큰술을 두르고 중강불에서 닭다리살을 껍질 면이 아래로 가도록 한 겹으로 펼쳐 4분간 노릇하게 굽는다.","닭을 뒤집어 3분간 더 굽고 속까지 익으면 당근과 대파 흰 부분을 넣어 1분간 함께 볶는다.","양배추를 넣고 강불에서 1분 30초간 빠르게 볶아 숨이 살짝 죽으면 데리야끼 소스를 둘러 붓는다.","소스가 끓어오르면 삶아둔 소바면을 넣고 강불에서 2분간 면 한 가닥에 윤기가 돌 때까지 빠르게 볶는다.","불을 끄고 어슷썬 대파 푸른 부분과 깨소금 1작은술을 뿌려 향을 살린다.","그릇에 1인분씩 담아 바로 내며, 면이 불기 쉬우므로 밀프랩 시 소스와 면을 따로 담는 것이 좋다."],"source":"https://www.youtube.com/@CookingHaru","sourceName":"쿠킹하루","tags":["원팬","볶음면","닭다리살","테리야키"],"servings":4,"storageInfo":"냉장 보관 3일, 면과 소스 분리 보관 권장"},{"name":"돼지고기 간장 덮밥","category":"additional","displayCategory":"korean","type":"one-pan","ingredients":["돼지고기 목살 500g","양파 2개","대파 1대","간장 4큰술","설탕 2큰술","다진마늘 1큰술","맛술 2큰술","후추 1꼬집","참기름 1큰술","밥 4인분","깨소금 1작은술"],"cookTime":20,"difficulty":"쉬움","calories":510,"protein":28,"steps":["돼지고기 목살 500g은 0.5cm 두께로 얇게 썰어 후추 1꼬집을 뿌려 두고, 양파 2개는 0.5cm 두께로 채 썬다.","작은 볼에 간장 4큰술, 설탕 2큰술, 다진마늘 1큰술, 맛술 2큰술을 넣고 설탕이 완전히 녹을 때까지 섞어 양념장을 만든다.","달군 팬에 식용유 1큰술을 두르고 중강불로 충분히 달군 뒤 돼지고기를 한 겹으로 펼쳐 넣어 분홍빛이 사라질 때까지 3분간 볶는다.","채 썬 양파를 넣고 숨이 살짝 죽고 가장자리가 투명해질 때까지 중불에서 2분간 함께 볶는다.","양념장을 팬 가장자리로 둘러 붓고 끓어오르면 중약불로 줄여 양파가 완전히 투명해지고 국물이 자작해질 때까지 5~6분간 졸인다.","대파 1대는 0.3cm 두께로 어슷 썰어 마무리용으로 준비한다.","국물이 윤기 있게 졸아들면 불을 끄고 참기름 1큰술을 둘러 향을 입힌다.","그릇에 밥 4인분을 1공기씩 나눠 담고 그 위에 고기와 양파를 국물과 함께 푸짐하게 올린다.","어슷썬 대파와 깨소금 1작은술을 뿌려 마무리하고, 밀폐용기에 1인분씩 나눠 담아 냉장 3일 이내로 보관한다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EB%8F%BC%EC%A7%80%EA%B3%A0%EA%B8%B0%20%EA%B0%84%EC%9E%A5%20%EB%8D%AE%EB%B0%A5","sourceName":"만개의레시피 검색","tags":["원팬","돼지고기","덮밥","간장","자취"],"servings":4,"storageInfo":"냉장 보관 4일, 밥과 분리 보관"},{"name":"새우 볶음밥","category":"additional","displayCategory":"asian","type":"one-pan","ingredients":["새우 300g","밥 4공기","달걀 3개","대파 2대","당근 1/2개","완두콩 65g","간장 2큰술","굴소스 1큰술","참기름 1큰술","소금 1꼬집","후추 1꼬집","식용유 3큰술"],"cookTime":15,"difficulty":"쉬움","calories":430,"protein":22,"steps":["새우 300g은 냉동이라면 찬물에 10분간 담가 해동한 뒤 키친타월로 물기를 꼼꼼히 제거하고 큰 새우는 2~3등분 한다.","당근 1/2개는 0.3cm 크기로 잘게 다지고, 대파 2대는 0.3cm 두께로 송송 썬다. 완두콩 65g은 냉동이라면 찬물에 헹궈 체에 밭쳐둔다.","달걀 3개는 볼에 깨 풀고 소금 1꼬집을 넣어 가볍게 풀어준다.","달군 팬에 식용유 1큰술을 두르고 중불에서 풀어둔 달걀을 부어 주걱으로 크게 저어 8할만 익은 스크램블 상태로 만들어 접시에 덜어둔다.","같은 팬에 식용유 1큰술을 추가해 강불로 달군 뒤 새우를 한 겹으로 펼쳐 1분간 볶다가 분홍빛이 돌면 다진 당근과 완두콩을 넣고 1분간 더 볶는다.","대파의 흰 부분을 먼저 넣어 30초간 향을 낸 뒤 밥 4공기를 넣고 주걱으로 밥을 누르듯 펼쳐가며 강불에서 2분간 고슬고슬하게 볶는다.","팬 가장자리로 간장 2큰술과 굴소스 1큰술을 둘러 부어 약 30초간 그을리듯 볶아 불맛을 더한다.","덜어둔 달걀을 다시 넣고 후추 1꼬집을 뿌려 30초간 골고루 섞는다.","불을 끄고 참기름 1큰술과 남은 대파를 올려 잔열로 향을 살린 뒤 그릇에 1인분씩 담아 완성한다.","밀폐용기에 1인분씩 나눠 담아 냉장 2일 이내로 보관하며 데울 때는 물 1큰술을 뿌려 전자레인지 2분 가열한다."],"source":"https://www.youtube.com/results?search_query=%EC%83%88%EC%9A%B0%20%EB%B3%B6%EC%9D%8C%EB%B0%A5%20%EB%A0%88%EC%8B%9C%ED%94%BC","sourceName":"YouTube 검색","tags":["원팬","볶음밥","새우","간편"],"servings":4,"storageInfo":"냉장 보관 3~4일, 전자레인지 재가열"},{"name":"닭다리살 갈릭 버터 구이","category":"additional","displayCategory":"western","type":"one-pan","ingredients":["닭다리살 600g","감자 2개","버터 3큰술","마늘 6쪽","로즈마리 2줄기","소금 1작은술","후추 1꼬집","레몬즙 1큰술","올리브오일 1큰술","파슬리 1큰술"],"cookTime":30,"difficulty":"보통","calories":460,"protein":32,"steps":["닭다리살 600g은 키친타월로 물기를 꼼꼼히 닦고 두꺼운 부분에 칼집을 살짝 내어 두께를 균일하게 만든다.","닭다리살에 소금 1작은술과 후추 1꼬집을 양면에 골고루 뿌려 10분간 실온에 두어 밑간이 배게 한다.","감자 2개는 껍질째 닦아 2cm 한입 크기로 깍둑썰고, 마늘 6쪽은 0.2cm 두께로 얇게 편 썬다.","감자는 끓는 물에 5분간 데쳐 살짝 익힌 뒤 체에 밭쳐 물기를 빼면 굽는 시간이 단축되고 속까지 잘 익는다.","달군 팬에 올리브오일 1큰술을 두르고 중강불에서 닭다리살을 껍질 면이 아래로 가도록 한 겹으로 펼쳐 5~6분간 누르듯 구워 껍질이 황금빛으로 바삭해지게 한다.","닭을 뒤집어 3분간 더 굽고 빈 공간에 데친 감자를 넣어 가장자리가 노릇해질 때까지 2분간 함께 굽는다.","중약불로 줄이고 버터 3큰술, 편 마늘, 로즈마리 2줄기를 팬 가장자리에 넣어 버터가 녹으면 스푼으로 거품을 끼얹으며 3~4분간 베이스팅한다.","닭 가장 두꺼운 부분에 칼을 찔러 맑은 육즙이 나오면 불을 끄고 레몬즙 1큰술을 둘러 산미를 더한다.","도마에 옮겨 5분간 휴지시킨 뒤 1.5cm 폭으로 슬라이스해 접시에 담고 감자와 마늘을 곁들인다.","다진 파슬리 1큰술을 뿌려 마무리하고 밀폐용기에 1인분씩 나눠 담아 냉장 3일 이내로 보관한다."],"source":"https://www.youtube.com/@JoshuaWeissman","sourceName":"Joshua Weissman","tags":["원팬","닭다리살","갈릭버터","고단백"],"servings":4,"storageInfo":"냉장 보관 4일, 에어프라이어 재가열 추천"},{"name":"원팟 크림 버섯 리조또","category":"additional","displayCategory":"western","type":"one-pot","ingredients":["쌀 360g","양송이버섯 200g","양파 1개","마늘 3쪽","생크림 200ml","치킨 브로스 500ml","파마산 치즈 3큰술","버터 2큰술","소금 1꼬집","후추 1꼬집","파슬리 1큰술"],"cookTime":30,"difficulty":"보통","calories":440,"protein":14,"steps":["쌀 360g은 씻지 않고 그대로 사용하고(전분이 농도를 만든다), 양송이버섯 200g은 0.3cm 두께로 슬라이스한다.","양파 1개는 0.3cm 크기로 잘게 다지고 마늘 3쪽도 곱게 다진다.","치킨 브로스 500ml는 작은 냄비에 넣고 약불로 데워 따뜻한 상태(70°C 이상)로 유지한다(찬 육수를 부으면 쌀이 익는 데 오래 걸린다).","두꺼운 냄비에 버터 1큰술을 중불에서 녹이고 슬라이스한 버섯을 넣어 4~5분간 수분이 날아가고 가장자리가 갈색이 될 때까지 볶아 접시에 덜어둔다.","같은 냄비에 남은 버터 1큰술을 추가해 다진 양파와 마늘을 넣고 중약불에서 3분간 양파가 투명해질 때까지 볶는다.","쌀을 넣고 중불에서 1~2분간 쌀알이 약간 투명해질 때까지 볶아 토스팅 향을 낸다.","따뜻한 치킨 브로스를 한 국자(약 100ml)씩 부어가며 쌀이 흡수할 때마다 다음 국자를 부어주고, 사이사이 저어가며 18~20분간 끓여 알단테 식감을 만든다.","쌀이 거의 익으면 볶아둔 버섯을 다시 넣고 생크림 200ml를 부어 1분간 저으며 졸인다.","불을 끄고 파마산 치즈 3큰술을 뿌려 잔열로 녹이며 부드럽게 섞은 뒤 소금 1꼬집·후추 1꼬집으로 간을 맞춘다.","그릇에 1인분씩 담아 다진 파슬리 1큰술을 뿌려 마무리하고, 밀폐용기에 보관 시 우유나 물 2큰술을 넣고 데우면 농도가 살아난다."],"source":"https://www.youtube.com/results?search_query=%EC%9B%90%ED%8C%9F%20%ED%81%AC%EB%A6%BC%20%EB%B2%84%EC%84%AF%20%EB%A6%AC%EC%A1%B0%EB%98%90%20%EB%A0%88%EC%8B%9C%ED%94%BC","sourceName":"YouTube 검색","tags":["원팟","리조또","버섯","크림"],"servings":4,"storageInfo":"냉장 보관 3일, 데울 때 우유나 물을 약간 추가"},{"name":"시트팬 허니머스타드 닭가슴살","category":"additional","displayCategory":"western","type":"sheet-pan","ingredients":["닭가슴살 500g","고구마 2개","브로콜리 1송이","올리브오일 2큰술","꿀 2큰술","통곡물 머스타드 2큰술","간장 1큰술","다진마늘 1큰술","소금 1꼬집","후추 1꼬집"],"cookTime":30,"difficulty":"쉬움","calories":380,"protein":34,"steps":["오븐을 200°C로 예열하고, 시트팬에 종이호일을 깔아 청소를 쉽게 한다.","닭가슴살 500g은 두께가 두꺼운 부분을 칼로 갈라 펼쳐 1.5cm 균일한 두께로 만들고 키친타월로 물기를 닦는다.","작은 볼에 꿀 2큰술, 통곡물 머스타드 2큰술, 간장 1큰술, 다진마늘 1큰술을 넣고 거품기로 1분간 매끈하게 섞어 허니머스타드 소스를 만든다.","닭가슴살에 소스의 절반을 붓으로 양면에 골고루 발라 10분간 재우고 나머지 소스는 마무리용으로 보관한다.","고구마 2개는 껍질째 닦아 1.5cm 두께의 반달로 썰고, 브로콜리 1송이는 한입 크기 송이로 나눈다.","큰 볼에 고구마와 브로콜리를 담고 올리브오일 2큰술, 소금 1꼬집, 후추 1꼬집을 넣어 골고루 버무린다.","시트팬 한쪽에 고구마를 한 겹으로 펼쳐 올리고 200°C 오븐에서 먼저 10분간 굽는다.","팬을 꺼내 빈 공간에 재운 닭가슴살과 브로콜리를 한 겹으로 배치하고 다시 200°C에서 15~18분간 닭이 완전히 익고 고구마가 포크로 부드럽게 들어갈 때까지 굽는다.","꺼낸 닭가슴살에 보관해둔 허니머스타드 소스를 한 번 더 발라 광택을 내고 5분간 휴지시킨 뒤 1.5cm 폭으로 슬라이스한다.","밀폐용기에 1인분씩 나눠 담아 냉장 3일 이내로 보관하며 도시락이나 한 끼 식사로 활용한다."],"source":"https://www.youtube.com/@HealthyMealPrep","sourceName":"Healthy Meal Prep","tags":["시트팬","닭가슴살","허니머스타드","고단백","다이어트"],"servings":4,"storageInfo":"냉장 보관 4~5일, 전자레인지 또는 에어프라이어 재가열"},{"name":"원팟 김치 참치 리조또","category":"additional","displayCategory":"korean","type":"one-pot","ingredients":["밥 2공기","김치 200g","참치캔 1개","양파 1/2개","모짜렐라 치즈 100g","물 200ml","고춧가루 1/2큰술","참기름 1큰술","버터 1큰술","대파 1/2대","김가루 1큰술"],"cookTime":15,"difficulty":"쉬움","calories":460,"protein":22,"steps":["양파 1/2개는 0.3cm 크기로 잘게 다지고, 김치 200g은 가위로 1cm 크기로 자른다.","참치캔 1개는 체에 받쳐 5분간 기름을 완전히 빼고, 대파 1/2대는 0.3cm 두께로 송송 썰어둔다.","두꺼운 냄비에 버터 1큰술을 중불에서 녹이고 다진 양파를 넣어 가장자리가 투명해질 때까지 2분간 볶는다.","김치를 넣고 가장자리가 살짝 노릇해질 때까지 중불에서 3분간 볶다가 고춧가루 1/2큰술을 넣어 30초간 더 볶아 매콤한 향을 낸다.","기름 뺀 참치를 넣고 1분간 가볍게 섞어 풀어준 뒤 밥 2공기와 물 200ml를 부어 강불로 끓인다.","끓어오르면 중약불로 줄이고 바닥이 눋지 않게 주걱으로 저으며 3분간 끓여 수분이 자작해지게 한다.","수분이 자작해지면 모짜렐라 치즈 100g(약 1컵)을 표면에 골고루 덮고 뚜껑을 닫아 약불에서 2분간 두어 치즈를 완전히 녹인다.","불을 끄고 참기름 1큰술을 둘러 향을 살린 뒤 송송 썬 대파와 김가루 1큰술을 흩뿌려 마무리한다.","그릇에 1인분씩 담아 바로 내며, 치즈가 식으면 굳으므로 밀프랩보다는 즉석 조리에 적합하다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%9B%90%ED%8C%9F%20%EA%B9%80%EC%B9%98%20%EC%B0%B8%EC%B9%98%20%EB%A6%AC%EC%A1%B0%EB%98%90","sourceName":"만개의레시피 검색","tags":["원팟","김치","참치","리조또","자취","치즈"],"servings":2,"storageInfo":"냉장 보관 2~3일, 데울 때 물 약간 추가"},{"name":"닭가슴살 카프레제 시트팬","category":"additional","displayCategory":"mediterranean","type":"sheet-pan","ingredients":["닭가슴살 500g","방울토마토 300g","모짜렐라 치즈 200g","바질 12.5g (약 한 줌)","올리브오일 3큰술","발사믹 글레이즈 2큰술","마늘 파우더 1작은술","소금 1꼬집","후추 1꼬집"],"cookTime":25,"difficulty":"쉬움","calories":390,"protein":36,"steps":["오븐을 200°C로 예열하고, 시트팬에 종이호일을 깔아 준비한다.","닭가슴살 500g은 두꺼운 부분을 갈라 1.5cm 균일한 두께로 만들고 키친타월로 표면 물기를 꼼꼼히 닦는다.","큰 볼에 닭가슴살, 올리브오일 2큰술, 마늘 파우더 1작은술, 소금 1꼬집, 후추 1꼬집을 넣고 손으로 골고루 주물러 10분간 재운다.","방울토마토 300g은 꼭지를 떼고 반으로 가르며, 모짜렐라 치즈 200g은 1cm 두께로 슬라이스한다.","시트팬에 재운 닭가슴살을 한 겹으로 펼쳐 올리고 200°C 오븐에서 12분간 먼저 굽는다.","팬을 꺼내 닭 주변 빈 공간에 방울토마토를 자른 면이 위로 가도록 흩뿌려 올리고 올리브오일 1큰술을 살짝 둘러 다시 6분간 굽는다.","꺼낸 닭가슴살 위에 슬라이스한 모짜렐라 치즈를 한 장씩 올리고 다시 200°C에서 4~5분간 치즈가 녹아 살짝 노릇해질 때까지 굽는다.","오븐에서 꺼내 신선한 바질 12.5g을 손으로 찢어 위에 흩뿌리고 발사믹 글레이즈 2큰술을 지그재그로 둘러 마무리한다.","5분간 살짝 식혀 육즙을 안정시킨 뒤 1.5cm 폭으로 슬라이스해 접시에 담는다.","밀폐용기에 1인분씩 나눠 담아 냉장 3일 이내로 보관하며 데울 때는 전자레인지보다 토스터 오븐이 치즈 식감을 살린다."],"source":"https://www.youtube.com/results?search_query=%EB%8B%AD%EA%B0%80%EC%8A%B4%EC%82%B4%20%EC%B9%B4%ED%94%84%EB%A0%88%EC%A0%9C%20%EC%8B%9C%ED%8A%B8%ED%8C%AC%20%EB%A0%88%EC%8B%9C%ED%94%BC","sourceName":"YouTube 검색","tags":["시트팬","닭가슴살","카프레제","지중해식","고단백"],"servings":4,"storageInfo":"냉장 보관 3~4일, 바질은 먹기 직전에 올리는 것 권장"},{"name":"소고기 야채 볶음 덮밥","category":"additional","displayCategory":"korean","type":"one-pan","ingredients":["소고기 불고기용 400g (목심·등심·앞다리살 2~3mm 슬라이스)","애호박 1개","양파 1개","파프리카 1개","간장 3큰술","올리고당 1큰술","다진마늘 1큰술","참기름 1큰술","후추 1꼬집","밥 4인분","깨소금 1작은술"],"cookTime":20,"difficulty":"쉬움","calories":440,"protein":26,"steps":["소고기 불고기용 400g은 키친타월로 핏물을 살짝 닦고 볼에 담아 간장 1큰술, 다진마늘 1/2큰술, 후추 1꼬집을 넣어 손으로 가볍게 주물러 10분간 재운다.","애호박 1개는 0.5cm 두께의 반달로 썰고, 양파 1개는 0.5cm 두께로 채 썰며, 파프리카 1개는 0.5cm 폭으로 채 썬다.","작은 볼에 간장 2큰술, 올리고당 1큰술, 다진마늘 1/2큰술을 넣고 섞어 마무리 양념을 만든다.","달군 팬에 식용유 1큰술을 두르고 강불에서 소고기를 한 겹으로 펼쳐 1분 30초간 빠르게 볶다가 색이 80% 변하면 접시에 덜어둔다.","같은 팬에 식용유 1큰술을 추가하고 양파를 넣어 강불에서 1분간 볶는다.","애호박과 파프리카를 추가해 강불에서 2분간 빠르게 볶아 채소가 살짝 익되 아삭함이 남도록 한다.","마무리 양념장을 둘러 붓고 끓어오르면 30초간 졸인 뒤 덜어둔 소고기를 다시 넣고 30초~1분간 골고루 섞어 양념이 입혀지게 한다.","불을 끄고 참기름 1큰술과 깨소금 1작은술을 뿌려 향을 살린다.","그릇에 밥 4인분을 1공기씩 담고 그 위에 소고기 야채 볶음을 푸짐하게 올려 완성한다.","밀폐용기에 1인분씩 나눠 담아 냉장 3일 이내로 보관하며 데울 때 참기름을 살짝 더 둘러 향을 되살린다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%86%8C%EA%B3%A0%EA%B8%B0%20%EC%95%BC%EC%B1%84%20%EB%B3%B6%EC%9D%8C%20%EB%8D%AE%EB%B0%A5","sourceName":"만개의레시피 검색","tags":["원팬","소고기","채소","덮밥"],"servings":4,"storageInfo":"냉장 보관 3~4일, 밥과 분리 보관"},{"name":"원팟 순두부찌개","category":"additional","displayCategory":"korean","type":"one-pot","ingredients":["순두부 2팩","돼지고기 다짐육 200g","김치 150g","양파 1/2개","대파 1대","달걀 2개","고춧가루 1큰술","다진마늘 1큰술","참기름 1큰술","국간장 1큰술","물 600ml"],"cookTime":20,"difficulty":"쉬움","calories":350,"protein":24,"steps":["양파 1/2개는 0.5cm 두께로 채 썰고, 김치 150g은 1cm 크기로 자르며, 대파 1대는 0.3cm 두께로 어슷 썬다.","돼지고기 다짐육 200g은 키친타월로 핏물을 살짝 닦아둔다.","두꺼운 냄비에 참기름 1큰술을 중불에서 두르고 다짐육을 넣어 주걱으로 풀어가며 3분간 핏기가 사라지고 살짝 갈색이 돌 때까지 볶는다.","잘게 썬 김치를 넣고 중불에서 2분간 가장자리가 노릇해지고 신맛이 살짝 가실 때까지 함께 볶는다.","고춧가루 1큰술과 다진마늘 1큰술을 넣고 약불로 줄여 30초간 향이 올라올 때까지 볶아 매콤한 베이스를 완성한다.","물 600ml를 붓고 강불로 끓이다가 끓어오르면 채 썬 양파와 국간장 1큰술을 넣어 중불에서 3분간 끓인다.","순두부 2팩을 큰 숟가락으로 떠 큼직하게 떠 넣고 너무 휘젓지 않은 채 4~5분간 끓여 두부 속까지 따뜻해지게 한다.","달걀 2개를 가운데에 깨 넣고 흰자가 응고되기 시작하면 어슷썬 대파를 올려 30초~1분간 더 끓인다.","기호에 따라 소금으로 간을 맞추고 불을 꺼 한 김 두면 국물이 더 깊어진다.","뜨거울 때 그대로 떠서 밥과 함께 내고, 밀폐용기 보관 시 달걀은 빼고 보관해 먹기 직전에 추가한다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%9B%90%ED%8C%9F%20%EC%88%9C%EB%91%90%EB%B6%80%EC%B0%8C%EA%B0%9C","sourceName":"만개의레시피 검색","tags":["원팟","순두부","찌개","매콤"],"servings":2,"storageInfo":"냉장 보관 2~3일, 순두부 식감이 변할 수 있어 빠른 섭취 권장"},{"name":"닭가슴살 로제 파스타","category":"additional","displayCategory":"western","type":"one-pot","ingredients":["닭가슴살 400g","펜네 파스타 300g","토마토소스 200ml","생크림 200ml","양파 1개","마늘 3쪽","파마산 치즈 2큰술","올리브오일 2큰술","소금 1꼬집","후추 1꼬집","바질 1큰술","물 300ml"],"cookTime":25,"difficulty":"쉬움","calories":490,"protein":30,"steps":["양파 1개는 0.3cm 크기로 잘게 다지고 마늘 3쪽은 곱게 다진다.","닭가슴살 400g은 키친타월로 물기를 닦고 2cm 한입 크기로 깍둑썰기 한 뒤 소금 1꼬집·후추 1꼬집으로 밑간한다.","깊은 팬이나 넓은 냄비를 중불로 달군 뒤 올리브오일 2큰술을 두르고 다진 마늘을 넣어 30초간 향을 낸다.","다진 양파를 추가해 중불에서 2분간 가장자리가 투명해질 때까지 볶는다.","닭가슴살을 넣고 중강불에서 3~4분간 겉면이 하얗게 익고 가장자리가 살짝 노릇해질 때까지 볶는다.","토마토소스 200ml, 생크림 200ml, 물 300ml를 부어 강불로 끓이다가 끓어오르면 펜네 파스타 300g을 넣고 한 번 저어 면이 잠기게 한다.","중불로 줄여 뚜껑을 비스듬히 덮고 12~15분간 2~3분 간격으로 저어가며 면이 알단테가 되고 소스가 크리미하게 농축될 때까지 끓인다.","수분이 너무 졸아붙으면 물 2~3큰술을 추가하고, 너무 묽으면 1~2분 더 졸여 농도를 맞춘다.","불을 끄고 파마산 치즈 2큰술을 뿌려 잔열로 녹이며 소금 1꼬집·후추 1꼬집으로 간을 맞춘다.","그릇에 1인분씩 담고 바질 1큰술을 손으로 찢어 올려 마무리하며, 밀폐용기에 보관 시 우유 2큰술을 넣고 데우면 농도가 살아난다."],"source":"https://www.youtube.com/@CookingHaru","sourceName":"쿠킹하루","tags":["원팟","로제","파스타","닭가슴살"],"servings":4,"storageInfo":"냉장 보관 3일, 데울 때 우유를 약간 추가하면 크리미해짐"},{"name":"매콤 닭볶음 쌈밥","category":"additional","displayCategory":"korean","type":"one-pan","ingredients":["닭다리살 500g","고추장 2큰술","고춧가루 1큰술","간장 2큰술","올리고당 2큰술","다진마늘 1큰술","양파 1개","대파 1대","깻잎 20장","밥 4인분","참기름 1큰술"],"cookTime":25,"difficulty":"쉬움","calories":430,"protein":30,"steps":["닭다리살 500g은 키친타월로 핏물을 제거한 뒤 2~3cm 한입 크기로 썰어 큰 볼에 담는다.","양파 1개는 1cm 두께로 굵게 채 썰고, 대파 1대는 0.5cm 두께로 어슷 썰어 준비한다.","깻잎 20장은 찬물에 헹궈 물기를 털어 키친타월로 닦아두고, 밥 4인분을 따뜻하게 준비한다.","작은 볼에 고추장 2큰술, 고춧가루 1큰술, 간장 2큰술, 올리고당 2큰술, 다진마늘 1큰술을 넣고 잘 섞어 양념장을 만든다.","닭다리살에 양념장을 넣고 손으로 골고루 무쳐 10분간 재워 양념이 배도록 한다.","달군 팬에 별도 기름 없이 중강불로 양념한 닭다리살을 펼쳐 넣고 4~5분간 겉면이 노릇하게 익도록 굽는다.","채 썬 양파를 넣고 중불로 줄여 3분간 더 볶아 양파가 반투명해지고 닭이 속까지 익도록 한다.","어슷 썬 대파를 넣고 1분간 빠르게 볶다가 양념이 살짝 졸아붙으면 참기름 1큰술을 둘러 향을 살린다.","밀프랩 용기에 밥을 1인분씩 담고 깻잎 5장씩 올린 뒤 닭볶음을 나눠 담아 냉장 보관 시 3일 이내 먹는다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EB%A7%A4%EC%BD%A4%20%EB%8B%AD%EB%B3%B6%EC%9D%8C%20%EC%8C%88%EB%B0%A5","sourceName":"만개의레시피 검색","tags":["원팬","닭다리살","매콤","쌈밥"],"servings":4,"storageInfo":"냉장 보관 4일, 깻잎은 따로 보관"},{"name":"돼지고기 미소 생강 볶음","category":"additional","displayCategory":"asian","type":"one-pan","ingredients":["돼지고기 목살 500g","양파 1개","양배추 1/4통","미소된장 2큰술","미림 2큰술","간장 1큰술","설탕 1큰술","생강 1톨","다진마늘 1큰술","식용유 2큰술","깨소금 1작은술","밥 4인분"],"cookTime":20,"difficulty":"쉬움","calories":450,"protein":26,"steps":["돼지고기 목살 500g은 0.5cm 두께로 얇게 썰어 키친타월로 핏물을 제거한다.","양파 1개는 1cm 두께 채 썰고, 양배추 1/4통은 사방 3cm 정도로 큼직하게 썰어 준비한다.","생강 1톨은 껍질을 벗기고 강판에 갈아 즙을 짜낸다(약 1작은술 분량).","작은 볼에 미소된장 2큰술, 미림 2큰술, 간장 1큰술, 설탕 1큰술, 생강즙, 다진마늘 1큰술을 넣고 덩어리 없이 풀어 양념장을 만든다.","달군 팬에 식용유 2큰술을 두르고 중강불에서 돼지고기를 펼쳐 넣어 2~3분간 겉면이 살짝 노릇해질 때까지 볶는다.","채 썬 양파를 넣고 1분간 볶다가 양배추를 넣어 숨이 살짝 죽도록 1분 더 볶는다.","양념장을 팬 가장자리부터 둘러 부어 향이 올라오면 중불로 줄이고 2~3분간 양념이 고기와 채소에 골고루 배도록 볶는다.","수분이 거의 졸아붙어 윤기가 돌면 불을 끄고 깨소금 1작은술을 뿌려 마무리한다.","밀프랩 용기에 밥 4인분을 1인분씩 담고 미소 생강 볶음을 나눠 담아 냉장 보관 시 3일 이내 먹는다."],"source":"https://www.youtube.com/@CookingHaru","sourceName":"쿠킹하루","tags":["원팬","돼지고기","미소","일본식","생강"],"servings":4,"storageInfo":"냉장 보관 4일, 밥과 분리 보관"},{"name":"시트팬 레몬허브 새우와 채소","category":"additional","displayCategory":"mediterranean","type":"sheet-pan","ingredients":["대하 500g","주키니호박 2개","방울토마토 200g","레몬 1개","마늘 4쪽","올리브오일 3큰술","오레가노 1작은술","소금 1꼬집","후추 1꼬집","파슬리 1큰술"],"cookTime":15,"difficulty":"쉬움","calories":280,"protein":28,"steps":["오븐을 210°C로 예열하고 시트팬에 종이호일을 깔아 준비한다.","대하 500g은 껍질과 내장을 제거하고 등을 살짝 갈라 흐르는 물에 헹군 뒤 키친타월로 물기를 완전히 제거한다.","주키니호박 2개는 1cm 두께 반달썰기하고, 방울토마토 200g은 꼭지를 제거해 준비한다.","마늘 4쪽은 곱게 다지고, 레몬 1개는 절반은 즙을 짜고 나머지는 0.3cm 두께로 슬라이스한다.","큰 볼에 올리브오일 3큰술, 다진 마늘, 오레가노 1작은술, 레몬즙, 소금 1꼬집, 후추 1꼬집을 섞어 마리네이드를 만든다.","마리네이드 절반은 새우에, 나머지는 주키니호박과 방울토마토에 각각 버무려 5분간 둔다.","시트팬에 채소를 먼저 펼치고 그 위에 새우와 레몬 슬라이스를 겹치지 않게 배치한다.","예열된 오븐 210°C에서 8~10분간 구워 새우가 분홍빛으로 변하고 채소가 살짝 노릇해지면 꺼낸다.","다진 파슬리 1큰술을 뿌려 마무리하고 밀프랩 용기에 1인분씩 나눠 담아 냉장 보관 시 2일 이내 먹는다."],"source":"https://www.youtube.com/results?search_query=%EC%8B%9C%ED%8A%B8%ED%8C%AC%20%EB%A0%88%EB%AA%AC%ED%97%88%EB%B8%8C%20%EC%83%88%EC%9A%B0%EC%99%80%20%EC%B1%84%EC%86%8C%20%EB%A0%88%EC%8B%9C%ED%94%BC","sourceName":"YouTube 검색","tags":["시트팬","새우","레몬","지중해식","저칼로리"],"servings":4,"storageInfo":"냉장 보관 3일, 새우는 과열 주의"},{"name":"소고기 토마토 스튜","category":"additional","displayCategory":"western","type":"one-pot","ingredients":["소고기 국거리 500g","감자 2개","당근 1개","양파 1개","토마토소스 400ml","토마토페이스트 2큰술","마늘 4쪽","월계수잎 2장","올리브오일 2큰술","소금 1꼬집","후추 1꼬집","물 400ml"],"cookTime":90,"difficulty":"보통","calories":420,"protein":30,"steps":["소고기 국거리 500g은 키친타월로 핏물을 제거하고 4cm 큼직하게 잘라 소금 1꼬집, 후추 1꼬집으로 골고루 밑간해 10분간 둔다.","양파 1개는 2cm 큼직하게 썰고, 마늘 4쪽은 굵게 다진다.","감자 2개와 당근 1개는 한입 크기(약 3cm)로 깍둑썰어 준비한다.","두꺼운 냄비에 올리브오일 2큰술을 두르고 중강불로 달군 뒤 소고기를 한 면씩 2분 이상 시어링해 사방을 노릇하게 굽고 잠시 꺼내둔다.","같은 냄비에 양파와 다진 마늘을 넣고 중불에서 3분간 양파가 반투명해질 때까지 볶아 향을 낸다.","토마토페이스트 2큰술을 넣고 1분간 볶아 신맛을 날린 뒤 당근, 감자를 넣고 가볍게 섞는다.","구운 소고기를 다시 넣고 토마토소스 400ml, 물 400ml, 월계수잎 2장을 부어 센불로 끓인다.","끓어오르면 약불로 줄이고 뚜껑을 덮어 75~85분간 가끔 저어가며 고기가 포크로 부드럽게 갈라질 때까지 뭉근히 끓인다.","월계수잎을 건져내고 소금 1꼬집, 후추 1꼬집으로 간을 맞춘 뒤 5분간 뚜껑 열고 졸여 농도를 맞춘다.","밀프랩 용기에 1인분씩 나눠 담아 냉장 4일 이내, 냉동 2주 이내 보관해 먹는다."],"source":"https://www.youtube.com/@JoshuaWeissman","sourceName":"Joshua Weissman","tags":["원팟","소고기","스튜","토마토"],"servings":4,"storageInfo":"냉장 보관 5일, 냉동 보관 2주 가능"},{"name":"원팟 치킨 알프레도 파스타","category":"additional","displayCategory":"western","type":"one-pot","ingredients":["닭가슴살 400g","페투치네 300g","생크림 300ml","파마산 치즈 4큰술","마늘 4쪽","버터 2큰술","소금 1꼬집","후추 1꼬집","파슬리 1큰술","물 400ml"],"cookTime":25,"difficulty":"쉬움","calories":700,"protein":32,"steps":["닭가슴살 400g은 키친타월로 핏물을 제거하고 사방 2cm 한입 크기로 깍둑썰어 소금 1꼬집, 후추 1꼬집으로 밑간한다.","마늘 4쪽은 곱게 다지고 파슬리 1큰술은 잘게 다져 준비한다.","넓고 깊은 팬에 버터 2큰술을 넣고 중불에서 녹인 뒤 닭가슴살을 펼쳐 넣고 3~4분간 겉면이 노릇해질 때까지 굽는다.","다진 마늘을 넣고 1분간 볶아 마늘 향이 올라오면 물 400ml를 부어 바닥에 눌어붙은 풍미를 긁어 섞는다.","생크림 300ml를 붓고 한 번 끓어오르면 페투치네 300g을 반으로 부러뜨려 부채꼴로 펼쳐 넣는다.","중약불에서 12~14분간 면이 골고루 익도록 1~2분 간격으로 저어가며 끓이고 면이 알덴테로 익으면 불을 끈다.","파마산 치즈 4큰술을 넣고 잔열에서 30초간 빠르게 저어 부드러운 크림소스 농도를 만든다.","소금 1꼬집, 후추 1꼬집으로 간을 맞추고 다진 파슬리를 뿌려 마무리한 뒤 1인분씩 따뜻할 때 담아낸다."],"source":"https://www.youtube.com/@HealthyMealPrep","sourceName":"Healthy Meal Prep","tags":["원팟","파스타","알프레도","크림"],"servings":4,"storageInfo":"냉장 보관 3일, 데울 때 우유 추가 권장"},{"name":"닭가슴살 탄두리 볼","category":"additional","displayCategory":"asian","type":"sheet-pan","ingredients":["닭가슴살 500g","플레인 요거트 150g","카레가루 2큰술","파프리카 파우더 1큰술","레몬즙 2큰술","다진마늘 1큰술","소금 1작은술","현미밥 4인분","오이 1개","방울토마토 200g","올리브오일 1큰술"],"cookTime":30,"difficulty":"보통","calories":400,"protein":35,"steps":["닭가슴살 500g은 키친타월로 물기를 제거하고 사방 3cm 큼직하게 깍둑썰어 큰 볼에 담는다.","또 다른 볼에 플레인 요거트 150g, 카레가루 2큰술, 파프리카 파우더 1큰술, 레몬즙 2큰술, 다진마늘 1큰술, 소금 1작은술을 넣고 덩어리 없이 잘 섞어 마리네이드를 만든다.","마리네이드를 닭가슴살에 부어 골고루 버무리고 냉장고에서 최소 30분(가능하면 2시간) 재운다.","오븐을 200°C로 예열하고 시트팬에 종이호일을 깐 뒤 올리브오일 1큰술을 얇게 발라둔다.","재워둔 닭가슴살을 시트팬에 겹치지 않게 펼쳐 200°C에서 20~25분간 구워 겉면이 진한 갈색이 돌고 속까지 완전히 익도록 한다.","굽는 동안 오이 1개는 1.5cm 깍둑썰고 방울토마토 200g은 반으로 잘라 준비한다.","현미밥 4인분을 따뜻하게 데워 1인분씩 밀프랩 용기에 담는다.","밥 위에 구운 닭가슴살, 오이, 방울토마토를 색감 있게 나눠 올리고 식힌 뒤 뚜껑을 덮어 냉장 보관 시 3일 이내 먹는다."],"source":"https://www.youtube.com/results?search_query=%EB%8B%AD%EA%B0%80%EC%8A%B4%EC%82%B4%20%ED%83%84%EB%91%90%EB%A6%AC%20%EB%B3%BC%20%EB%A0%88%EC%8B%9C%ED%94%BC","sourceName":"YouTube 검색","tags":["시트팬","닭가슴살","탄두리","고단백","인도식"],"servings":4,"storageInfo":"냉장 보관 4~5일, 밥과 분리 보관"},{"name":"원팟 부대찌개","category":"additional","displayCategory":"korean","type":"one-pot","ingredients":["스팸 1캔","비엔나 소시지 4개","라면사리 2개","김치 200g","떡 150g","단단한 두부 1/2모","대파 1대","고춧가루 1큰술","고추장 1큰술","다진마늘 1큰술","물 800ml"],"cookTime":20,"difficulty":"쉬움","calories":750,"protein":22,"steps":["스팸 1캔은 0.7cm 두께로 슬라이스한 뒤 한입 크기로 자르고, 비엔나 소시지 4개는 0.5cm 두께로 어슷 썬다.","단단한 두부 1/2모는 1.5cm 두께로 큼직하게 썰고, 떡 150g은 미지근한 물에 5분간 불려둔다.","김치 200g은 2cm 폭으로 썰고, 대파 1대는 0.5cm 두께로 어슷 썬다.","작은 볼에 고춧가루 1큰술, 고추장 1큰술, 다진마늘 1큰술을 섞어 양념장을 만들어둔다.","넓은 냄비 바닥에 김치를 평평하게 깔고 그 위에 스팸, 소시지, 두부, 불린 떡을 보기 좋게 둘러 담는다.","가운데에 양념장을 올리고 물 800ml를 가장자리부터 부어 센불로 끓인다.","끓어오르면 중불로 줄이고 뚜껑을 살짝 열어 7~8분간 끓여 김치 향과 양념이 어우러지도록 한다.","라면사리 2개를 넣고 면이 풀어지도록 3분간 더 끓인 뒤 어슷 썬 대파를 올려 30초 더 끓여 마무리한다.","뚝배기째 또는 1인분 그릇에 나눠 담아 따뜻할 때 바로 먹는다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%9B%90%ED%8C%9F%20%EB%B6%80%EB%8C%80%EC%B0%8C%EA%B0%9C","sourceName":"만개의레시피 검색","tags":["원팟","부대찌개","찌개","간편"],"servings":3,"storageInfo":"냉장 보관 2~3일, 면은 당일 섭취 권장하고 국물만 보관"},{"name":"닭가슴살 페스토 시트팬","category":"additional","displayCategory":"mediterranean","type":"sheet-pan","ingredients":["닭가슴살 500g","바질 페스토 2큰술","방울토마토 300g","주키니호박 2개","올리브오일 2큰술","소금 1꼬집","후추 1꼬집","파마산 치즈 2큰술","레몬즙 1큰술"],"cookTime":25,"difficulty":"쉬움","calories":370,"protein":34,"steps":["오븐을 200°C로 예열하고 시트팬에 종이호일을 깔아 준비한다.","닭가슴살 500g은 두께가 두꺼운 부분을 칼집 내어 평평하게 펴고 키친타월로 물기를 제거한다.","닭가슴살 양면에 바질 페스토 2큰술을 골고루 발라 소금 1꼬집, 후추 1꼬집을 뿌려 5분간 둔다.","주키니호박 2개는 1cm 두께 반달썰기하고, 방울토마토 300g은 꼭지를 제거해 큰 볼에 담는다.","채소에 올리브오일 2큰술, 소금 1꼬집, 후추 1꼬집을 넣고 골고루 버무린다.","시트팬 가운데에 닭가슴살을 놓고 주위에 채소를 겹치지 않게 펼친다.","예열된 오븐 200°C에서 20~25분간 구워 닭가슴살 가장 두꺼운 부위 속살이 불투명해지고 채소가 살짝 그을리도록 한다.","꺼낸 즉시 파마산 치즈 2큰술과 레몬즙 1큰술을 뿌려 마무리하고, 1인분씩 밀프랩 용기에 담아 냉장 보관 시 3일 이내 먹는다."],"source":"https://www.youtube.com/@HealthyMealPrep","sourceName":"Healthy Meal Prep","tags":["시트팬","닭가슴살","페스토","지중해식","다이어트"],"servings":4,"storageInfo":"냉장 보관 4일, 에어프라이어 재가열 추천"},{"name":"돼지고기 오이무침 냉면풍 비빔밥","category":"additional","displayCategory":"korean","type":"standard","ingredients":["돼지고기 앞다리살 400g","오이 2개","밥 4인분","고추장 3큰술","양조식초 2큰술","간장 1큰술","설탕 1큰술","참기름 1큰술","다진마늘 1큰술","달걀 4개","깨소금 1작은술","고춧가루 1큰술"],"cookTime":25,"difficulty":"보통","calories":460,"protein":28,"steps":["돼지고기 앞다리살 400g은 0.5cm 두께로 얇게 썰고 간장 1큰술, 다진마늘 1큰술의 절반으로 밑간해 10분간 둔다.","오이 2개는 0.3cm 두께로 어슷 썬 뒤 다시 0.3cm 채 썰어 큰 볼에 담는다.","작은 볼에 고추장 3큰술, 양조식초 2큰술, 설탕 1큰술, 참기름 1큰술의 절반, 고춧가루 1큰술, 남은 다진마늘을 섞어 새콤매콤한 비빔양념장을 만든다.","냄비에 물을 충분히 끓여 달걀 4개를 넣고 정확히 7분간 삶은 뒤 찬물에 식혀 껍질을 벗겨 반숙으로 준비한다.","달군 팬에 기름 없이 중강불로 밑간한 돼지고기를 펼쳐 넣고 3~4분간 겉면이 노릇하고 수분이 날아갈 때까지 볶는다.","오이에 양념장 1큰술과 깨소금 1작은술을 넣어 가볍게 무쳐 색이 들도록 5분간 둔다.","밀프랩 용기에 밥 4인분을 1인분씩 담고 한쪽엔 볶은 돼지고기, 다른 쪽엔 양념 오이를 색감 있게 올린다.","반숙 달걀을 반으로 갈라 위에 올리고 남은 비빔양념장을 작은 용기에 따로 담아 먹기 직전 비벼 먹도록 한다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EB%8F%BC%EC%A7%80%EA%B3%A0%EA%B8%B0%20%EC%98%A4%EC%9D%B4%EB%AC%B4%EC%B9%A8%20%EB%83%89%EB%A9%B4%ED%92%8D%20%EB%B9%84%EB%B9%94%EB%B0%A5","sourceName":"만개의레시피 검색","tags":["비빔밥","돼지고기","매콤","냉면풍"],"servings":4,"storageInfo":"냉장 보관 3일, 양념장은 별도 보관"},{"name":"원팟 크림 떡볶이","category":"additional","displayCategory":"korean","type":"one-pot","ingredients":["떡볶이떡 500g","비엔나 소시지 4개","양배추 1/4통","양파 1/2개","우유 300ml","생크림 200ml","모짜렐라 치즈 100g","간장 1큰술","설탕 1/2큰술","마늘 파우더 1작은술","소금 1꼬집","후추 1꼬집"],"cookTime":20,"difficulty":"쉬움","calories":480,"protein":16,"steps":["떡볶이떡 500g은 미지근한 물에 5분간 담가 부드럽게 불린 뒤 체에 받쳐 물기를 뺀다.","비엔나 소시지 4개는 0.5cm 두께로 어슷 썰고, 양배추 1/4통은 사방 2cm로 큼직하게 썬다.","양파 1/2개는 1cm 두께로 채 썰어 준비한다.","넓고 깊은 냄비에 우유 300ml와 생크림 200ml를 붓고 중약불에서 가장자리에 거품이 보글보글 올라올 때까지 데운다.","불린 떡과 어슷 썬 소시지를 넣고 중불로 올려 떡이 서로 붙지 않도록 저어가며 3~4분간 끓인다.","양배추, 양파를 넣고 간장 1큰술, 설탕 1/2큰술, 마늘 파우더 1작은술, 소금 1꼬집, 후추 1꼬집으로 간한다.","중약불에서 4~5분간 자주 저어가며 떡이 부드러워지고 소스가 자작하게 졸아 떡에 코팅될 때까지 끓인다.","불을 끄고 모짜렐라 치즈 100g을 골고루 올린 뒤 뚜껑을 덮고 1~2분 두어 잔열로 치즈를 녹여 바로 그릇에 담아낸다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%9B%90%ED%8C%9F%20%ED%81%AC%EB%A6%BC%20%EB%96%A1%EB%B3%B6%EC%9D%B4","sourceName":"만개의레시피 검색","tags":["원팟","떡볶이","크림","치즈","자취"],"servings":3,"storageInfo":"냉장 보관 2~3일, 떡이 굳을 수 있어 데울 때 우유 추가"},{"name":"갈비찜 덮밥","category":"additional","displayCategory":"korean","type":"one-pot","ingredients":["소갈비 1kg","감자 2개","당근 1개","양파 1개","대파 1대","간장 5큰술","설탕 2큰술","올리고당 2큰술","다진마늘 2큰술","맛술 3큰술","참기름 1큰술","후추 1꼬집","물 500ml","현미밥 4공기"],"cookTime":60,"difficulty":"보통","calories":860,"protein":35,"steps":["소갈비 1kg은 찬물에 1시간 이상 담가 핏물을 빼고 중간에 한 번 물을 갈아준다.","끓는 물에 갈비를 넣고 5분간 데친 뒤 찬물에 헹궈 기름과 잡내를 제거하고 뼈 사이 핏물을 깨끗이 닦아낸다.","감자 2개와 당근 1개는 모서리를 둥글게 깎아 4cm 큼직하게 썰고, 양파 1개는 4등분, 대파 1대는 3cm 길이로 썬다.","큰 볼에 간장 5큰술, 설탕 2큰술, 올리고당 2큰술, 다진마늘 2큰술, 맛술 3큰술, 후추 1꼬집을 잘 섞어 양념장을 만든다.","두꺼운 냄비에 데친 갈비와 양념장 절반, 물 500ml를 넣고 센불로 끓이다 끓어오르면 거품을 걷어낸다.","약불로 줄이고 뚜껑을 덮어 40분간 가끔 위아래를 뒤집어주며 고기가 부드러워지도록 졸인다.","감자, 당근, 양파와 남은 양념장을 넣고 중약불로 15분 더 끓여 채소가 속까지 익고 국물이 자작하게 졸도록 한다.","대파와 참기름 1큰술을 넣고 1분 더 끓인 뒤 불을 꺼 5분간 뜸 들여 양념이 깊이 배도록 한다.","갈비를 꺼내 살을 결대로 발라낸 뒤 깍둑썬 채소와 함께 다시 냄비 양념 국물에 섞는다.","보관 용기 4개에 현미밥 1공기씩 담고 그 위에 발라낸 갈비살과 채소를 1/4씩 얹은 뒤 진한 양념 국물을 2~3큰술 둘러 덮밥으로 완성한다(밥과 토핑은 식힌 뒤 별도 보관 가능, 데울 때 물 1~2큰술 추가)."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%86%8C%EA%B3%A0%EA%B8%B0%20%EA%B0%88%EB%B9%84%EC%B0%9C","sourceName":"만개의레시피 검색","tags":["원팟","소갈비","갈비찜","덮밥","보양식"],"servings":4,"storageInfo":"밥과 갈비살 토핑 별도 보관 권장, 냉장 4일 이내 섭취 / 냉동 2주","variant":"기본"},{"name":"치킨 타코 랩 (Chicken Taco Wrap)","category":"additional","displayCategory":"mexican","type":"one-pan","ingredients":["닭다리살 500g","타코 시즈닝 2큰술","통밀 또띠야 4장","양상추 1/4통","옥수수 통조림 1/2캔","검은콩 통조림 1/2캔","방울토마토 150g","적양파 1/4개","슈레드 체다 치즈 80g","라임즙 2큰술","올리브오일 2큰술","소금 1꼬집","후추 1꼬집"],"cookTime":25,"difficulty":"쉬움","calories":470,"protein":32,"steps":["닭다리살 500g은 키친타월로 물기를 제거한 뒤 양면에 타코 시즈닝 2큰술과 소금 1꼬집을 고르게 묻혀 10분간 재운다.","양상추 1/4통은 0.5cm 두께로 가늘게 채 썰어 찬물에 5분간 담갔다 체에 받쳐 물기를 충분히 털어 아삭하게 준비한다.","방울토마토 150g은 1cm 크기로 깍둑썰고, 적양파 1/4개는 0.3cm로 잘게 다져 키친타월에 올려 매운맛을 살짝 빼둔다.","옥수수 통조림 1/2캔과 검은콩 통조림 1/2캔은 각각 체에 받쳐 흐르는 물에 한 번 헹군 뒤 물기를 완전히 뺀다.","달군 팬에 올리브오일 2큰술을 두르고 중강불에서 닭다리살을 껍질 면부터 4분간 노릇하게 구운 뒤 뒤집어 3~4분 더 익혀 속까지 완전히 익도록 한다.","구운 닭다리살을 도마로 옮겨 5분간 휴지시킨 뒤 두 개의 포크로 결대로 잘게 찢어 그릇에 담아둔다.","동일한 팬을 다시 중불로 가열해 옥수수와 검은콩을 넣고 2분간 볶아 수분을 날리고 가장자리가 살짝 노릇해질 때까지 익힌 뒤 불을 끈다.","작은 볼에 깍둑 썬 방울토마토, 다진 적양파, 라임즙 2큰술, 후추 1꼬집을 넣고 가볍게 버무려 산뜻한 살사를 만든다(소금간은 닭고기 시즈닝과 겹치지 않게 생략).","마른 팬을 약불로 달궈 통밀 또띠야 4장을 한 장씩 한 면당 30초씩 데워 부드럽게 만든 뒤 도마에 펼친다.","각 또띠야 가운데에 채 썬 양상추 → 찢은 닭고기 1/4씩 → 옥수수·검은콩 → 살사 → 슈레드 체다 치즈 20g 순으로 길게 올린다(가장자리 3cm는 비워둔다).","또띠야 양옆을 안쪽으로 살짝 접은 뒤 아래쪽부터 단단하게 말아 종이호일이나 랩으로 꽉 감싸 5분간 두어 모양을 잡는다.","랩으로 감싼 채 비스듬히 반으로 갈라 밀프랩 용기에 담고, 또띠야가 눅눅해지지 않도록 냉장 24시간 이내로 섭취한다(살사는 따로 담으면 더 오래 신선)."],"source":"https://www.youtube.com/results?search_query=%EC%B9%98%ED%82%A8%20%ED%83%80%EC%BD%94%20%EB%9E%A9%20%EB%A0%88%EC%8B%9C%ED%94%BC","sourceName":"YouTube 검색","tags":["타코랩","닭다리살","멕시칸","간편","도시락"],"servings":4,"storageInfo":"냉장 24시간 이내 — 또띠야가 눅눅해지지 않도록 빠르게 섭취. 살사는 따로 담으면 더 오래 신선"},{"name":"원팟 된장 삼겹살 찌개","category":"additional","displayCategory":"korean","type":"one-pot","ingredients":["삼겹살 300g","감자 1개","양파 1/2개","단단한 두부 1/2모","애호박 1/2개","대파 1대","된장 2큰술","고추장 1/2큰술","다진마늘 1큰술","고춧가루 1/2큰술","물 600ml","참기름 1큰술"],"cookTime":25,"difficulty":"쉬움","calories":420,"protein":20,"steps":["삼겹살 300g은 1.5cm 두께 한입 크기로 썰어 키친타월로 핏물을 제거한다.","감자 1개는 2cm 깍둑썰고, 양파 1/2개는 2cm 사각으로 썬다.","애호박 1/2개는 1cm 두께 반달썰기, 단단한 두부 1/2모는 2cm 깍둑썰기, 대파 1대는 0.5cm 어슷 썰어 준비한다.","달군 냄비에 참기름 1큰술을 두르고 중불에서 삼겹살을 펼쳐 넣어 3~4분간 겉면이 노릇하고 기름이 살짝 나올 때까지 볶는다.","된장 2큰술과 고추장 1/2큰술을 넣고 30초간 볶아 장의 풋내를 날린다.","물 600ml를 붓고 감자, 양파를 넣어 센불로 끓이다 끓어오르면 거품을 걷어내고 중불로 줄여 8분간 끓인다.","감자가 젓가락으로 부드럽게 들어갈 정도로 익으면 다진마늘 1큰술과 고춧가루 1/2큰술을 넣어 푼다.","애호박과 두부를 넣고 4분 더 끓인 뒤 어슷 썬 대파를 올려 1분 끓여 마무리해 따뜻한 밥과 함께 낸다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%9B%90%ED%8C%9F%20%EB%90%9C%EC%9E%A5%20%EC%82%BC%EA%B2%B9%EC%82%B4%20%EC%B0%8C%EA%B0%9C","sourceName":"만개의레시피 검색","tags":["원팟","된장","삼겹살","찌개"],"servings":3,"storageInfo":"냉장 보관 3~4일, 밥과 별도 보관"},{"name":"시트팬 치킨 사테이와 채소","category":"additional","displayCategory":"asian","type":"sheet-pan","ingredients":["닭다리살 500g","파프리카 2개","브로콜리 1송이","땅콩버터 3큰술","간장 2큰술","라임즙 2큰술","올리고당 1큰술","스리라차 소스 1큰술","다진마늘 1큰술","올리브오일 2큰술","소금 1꼬집"],"cookTime":30,"difficulty":"보통","calories":420,"protein":30,"steps":["닭다리살 500g은 키친타월로 물기를 제거하고 사방 3cm 한입 크기로 썰어 큰 볼에 담는다.","작은 볼에 땅콩버터 3큰술, 간장 2큰술, 라임즙 2큰술, 올리고당 1큰술, 스리라차 소스 1큰술, 다진마늘 1큰술을 넣고 덩어리 없이 매끈하게 풀어 사테이 소스를 만든다.","사테이 소스의 절반을 닭다리살에 부어 손으로 골고루 버무리고 냉장고에서 20분간 재운다.","오븐을 200°C로 예열하고 시트팬에 종이호일을 깔아 준비한다.","파프리카 2개는 2.5cm 사각으로 썰고, 브로콜리 1송이는 한입 크기 송이로 분리해 큰 볼에 담는다.","채소에 올리브오일 2큰술과 소금 1꼬집을 넣고 골고루 버무린다.","시트팬 한쪽에 채소를, 반대쪽에 재워둔 닭다리살을 겹치지 않게 펼쳐 담는다.","예열된 오븐 200°C에서 25~30분간 구워 닭이 진한 갈색이 돌고 채소 가장자리가 살짝 그을리면 꺼낸다.","남은 사테이 소스를 따뜻한 닭과 채소 위에 골고루 뿌려 마무리하고, 1인분씩 밀프랩 용기에 담아 냉장 보관 시 3일 이내 먹는다."],"source":"https://www.youtube.com/@JoshuaWeissman","sourceName":"Joshua Weissman","tags":["시트팬","닭다리살","사테이","태국식","땅콩"],"servings":4,"storageInfo":"냉장 보관 4일, 에어프라이어 재가열 추천"},{"name":"원팟 스팸 김치볶음밥 리조또","category":"additional","displayCategory":"korean","type":"one-pot","ingredients":["스팸 1/2캔","김치 200g","밥 2공기","달걀 2개","모짜렐라 치즈 100g","대파 1대","참기름 1큰술","고춧가루 1/2큰술","김가루 1큰술","물 100ml"],"cookTime":15,"difficulty":"쉬움","calories":500,"protein":20,"steps":["스팸 1/2캔은 1cm 깍둑썰고, 김치 200g은 1.5cm 폭으로 썰어 국물을 살짝 짜둔다.","대파 1대는 0.5cm 두께로 송송 썰어 흰 부분과 푸른 부분을 분리해둔다.","달군 팬에 별도 기름 없이 중강불에서 스팸을 펼쳐 넣고 2~3분간 사면이 노릇해질 때까지 굽고 잠시 꺼내둔다.","같은 팬에 참기름 1큰술을 두르고 김치를 넣어 중불에서 2분간 신맛이 날아갈 때까지 볶는다.","고춧가루 1/2큰술과 대파 흰 부분을 넣고 30초간 볶아 고추기름과 파 향을 낸다.","밥 2공기와 물 100ml를 붓고 중불에서 2~3분간 주걱으로 눌러가며 밥알이 김치 양념을 머금고 가장자리가 살짝 졸아붙도록 볶는다.","구운 스팸을 가운데에 올리고 모짜렐라 치즈 100g을 전체에 골고루 뿌린 뒤 뚜껑을 덮어 약불에서 2분간 둔다.","치즈가 완전히 녹으면 미리 부친 달걀 프라이 2개를 가운데에 올리고 대파 푸른 부분과 김가루 1큰술을 뿌려 따뜻할 때 바로 먹는다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%9B%90%ED%8C%9F%20%EC%8A%A4%ED%8C%B8%20%EA%B9%80%EC%B9%98%EB%B3%B6%EC%9D%8C%EB%B0%A5%20%EB%A6%AC%EC%A1%B0%EB%98%90","sourceName":"만개의레시피 검색","tags":["원팟","스팸","김치","치즈","자취"],"servings":2,"storageInfo":"냉장 보관 2~3일, 달걀은 당일 조리"},{"name":"한국식 마파두부 덮밥","category":"additional","displayCategory":"korean","type":"one-pan","ingredients":["단단한 두부 1모","돼지고기 다짐육 200g","대파 2대","양파 1/2개","고추장 1큰술","두반장 1큰술","간장 1큰술","다진마늘 1큰술","전분 1큰술","물 200ml","참기름 1큰술","밥 4인분","식용유 2큰술"],"cookTime":20,"difficulty":"보통","calories":440,"protein":24,"steps":["단단한 두부 1모는 1.5cm 깍둑썰어 끓는 소금물에 30초간 데친 뒤 체에 받쳐 물기를 빼두면 으깨지지 않는다.","대파 2대는 0.3cm 두께로 송송 썰고, 양파 1/2개는 0.5cm 사각으로 잘게 다진다.","작은 볼에 고추장 1큰술, 두반장 1큰술, 간장 1큰술과 물 200ml를 섞어 양념물을 만들어둔다.","전분 1큰술은 물 1큰술에 풀어 전분물을 만들고, 따뜻한 밥 4인분을 그릇에 미리 담아둔다.","달군 팬에 식용유 2큰술을 두르고 중강불에서 돼지고기 다짐육 200g을 넣어 3~4분간 부슬부슬해질 때까지 볶는다.","다진 양파와 다진마늘 1큰술을 넣고 1분간 볶아 양파가 반투명해지고 마늘 향이 올라오도록 한다.","양념물을 부어 끓어오르면 데친 두부를 넣고 두부가 부서지지 않게 살살 저으며 중불에서 4분간 끓여 양념이 배도록 한다.","전분물을 가장자리부터 둘러 부으며 빠르게 저어 걸쭉한 농도를 만든 뒤, 송송 썬 대파와 참기름 1큰술을 넣고 30초 더 끓여 불을 끈다.","준비한 밥 위에 마파두부를 넉넉히 올려 1인분씩 밀프랩 용기에 담고 냉장 보관 시 2일 이내 먹는다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%ED%95%9C%EA%B5%AD%EC%8B%9D%20%EB%A7%88%ED%8C%8C%EB%91%90%EB%B6%80%20%EB%8D%AE%EB%B0%A5","sourceName":"만개의레시피 검색","tags":["원팬","마파두부","두부","덮밥","매콤"],"servings":4,"storageInfo":"냉장 보관 3~4일, 밥과 분리 보관"},{"name":"시트팬 지중해식 연어 구이","category":"additional","displayCategory":"mediterranean","type":"sheet-pan","ingredients":["연어 필렛 4조각","올리브 100g","방울토마토 200g","케이퍼 2큰술","레몬 1개","마늘 4쪽","올리브오일 3큰술","오레가노 1작은술","소금 1꼬집","후추 1꼬집","딜 1/2작은술"],"cookTime":20,"difficulty":"쉬움","calories":380,"protein":32,"steps":["오븐을 200°C로 예열하고 시트팬에 종이호일을 깔아 준비한다.","연어 필렛 4조각은 키친타월로 물기를 완전히 제거한 뒤 양면에 소금 1꼬집과 후추 1꼬집을 골고루 뿌린다.","마늘 4쪽은 0.2cm 두께로 편 썰고, 레몬 1개는 절반 즙을 짜고 나머지는 0.3cm 두께로 슬라이스한다.","연어에 올리브오일 1큰술과 레몬즙을 끼얹고 오레가노 1작은술을 뿌려 5분간 둔다.","방울토마토 200g, 올리브 100g, 케이퍼 2큰술을 큰 볼에 담고 남은 올리브오일 2큰술과 편 마늘을 넣어 가볍게 버무린다.","시트팬 가운데에 연어를 껍질이 아래로 가도록 놓고 주위에 버무린 토마토, 올리브, 케이퍼, 마늘을 펼친다.","예열된 오븐 200°C에서 15~18분간 구워 연어 가운데가 포크로 살짝 갈라지고 살색이 분홍빛으로 살짝 남아있는 정도로 익힌다.","꺼낸 즉시 딜 1/2작은술과 레몬 슬라이스를 올려 향을 더하고, 1인분씩 밀프랩 용기에 담아 냉장 보관 시 2일 이내 먹는다."],"source":"https://www.youtube.com/@HealthyMealPrep","sourceName":"Healthy Meal Prep","tags":["시트팬","연어","지중해식","올리브","고단백"],"servings":4,"storageInfo":"냉장 보관 3일, 연어는 과열 주의"},{"name":"닭가슴살 간장 마늘 볶음밥","category":"additional","displayCategory":"korean","type":"one-pan","ingredients":["닭가슴살 400g","밥 4공기","달걀 3개","마늘 6쪽","대파 2대","간장 3큰술","버터 2큰술","소금 1꼬집","후추 1꼬집","깨소금 1작은술"],"cookTime":15,"difficulty":"쉬움","calories":420,"protein":30,"steps":["닭가슴살 400g은 키친타월로 핏물을 닦은 뒤 사방 1cm 크기로 잘게 깍둑썰고 소금 1꼬집·후추 1꼬집으로 밑간해 5분간 둔다.","마늘 6쪽은 0.2cm 두께로 편 썰고 대파 2대는 송송 썰어 흰 부분과 푸른 부분을 분리해 둔다.","달걀 3개는 볼에 깨뜨려 넣고 젓가락으로 노른자와 흰자가 완전히 섞이도록 풀어둔다.","달군 팬에 버터 2큰술을 넣어 약불에서 녹이고 마늘 편을 넣어 2분간 천천히 볶다가 가장자리가 황금색으로 노릇해지면 꺼내 따로 둔다.","같은 팬에 닭가슴살을 넣어 중불에서 4분간 볶아 겉면이 노릇하고 속까지 완전히 익도록 한다.","닭가슴살을 팬 한쪽으로 밀어두고 빈 자리에 풀어둔 달걀을 부어 30초간 두었다가 젓가락으로 빠르게 휘저어 스크램블로 익힌다.","밥 4공기와 대파 흰 부분을 넣고 팬 가장자리에 간장 3큰술을 둘러 불향이 올라오면 센불에서 2분간 주걱으로 눌러가며 고슬고슬하게 볶는다.","마지막에 볶아둔 마늘 편, 대파 푸른 부분, 깨소금 1작은술을 뿌려 30초 더 볶은 뒤 불을 끄고 한 김 식혀 1인분씩 밀프랩 용기에 담아 냉장 3일 이내 먹는다."],"source":"https://www.youtube.com/@CookingHaru","sourceName":"쿠킹하루","tags":["원팬","볶음밥","닭가슴살","마늘","간편"],"servings":4,"storageInfo":"냉장 보관 3~4일, 전자레인지 재가열"},{"name":"원팟 닭개장","category":"additional","displayCategory":"korean","type":"one-pot","ingredients":["닭다리살 500g","대파 3대","숙주 200g","고사리 100g","달걀 2개","고춧가루 2큰술","국간장 2큰술","다진마늘 1큰술","참기름 2큰술","후추 1꼬집","물 1L"],"cookTime":40,"difficulty":"보통","calories":380,"protein":30,"steps":["닭다리살 500g은 끓는 물에 넣어 1분간 데쳐 잡내를 제거한 뒤 찬물에 헹군다.","냄비에 물 1L와 데친 닭다리살을 넣고 센불로 끓이다 끓어오르면 중불로 줄여 20분간 삶는다.","닭은 건져 한 김 식힌 뒤 결대로 잘게 찢고, 육수는 면포에 한 번 걸러 보관한다.","대파 3대는 길이 5cm로 썬 뒤 세로로 4등분하고, 고사리 100g은 4cm 길이로 자르고, 숙주 200g은 흐르는 물에 헹궈 물기를 뺀다.","달군 냄비에 참기름 2큰술을 두르고 약불에서 고춧가루 2큰술을 넣어 30초간 볶아 고추기름을 낸다.","대파를 넣고 중불로 올려 1분간 볶다 숨이 살짝 죽으면 고사리를 넣어 1분 더 볶는다.","찢은 닭고기와 다진마늘 1큰술을 넣고 30초간 볶아 양념을 입힌 뒤 보관해둔 육수를 부어 센불로 끓인다.","끓어오르면 숙주를 넣고 국간장 2큰술과 후추 1꼬집으로 간을 맞춰 중불에서 5분간 더 끓인다.","달걀 2개를 잘 풀어 끓는 국물 위에 가늘게 둘러 부어 30초간 두었다가 살짝만 저어 부드러운 줄알을 만들고 불을 끈다.","1인분씩 그릇에 담아 따뜻한 밥과 함께 내고 밀프랩 시 냉장 3일 이내 먹는다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%9B%90%ED%8C%9F%20%EB%8B%AD%EA%B0%9C%EC%9E%A5","sourceName":"만개의레시피 검색","tags":["원팟","닭개장","매콤","국물"],"servings":4,"storageInfo":"냉장 보관 4~5일, 냉동 보관 2주 가능"},{"name":"시트팬 스파이시 치킨과 고구마","category":"additional","displayCategory":"western","type":"sheet-pan","ingredients":["닭다리살 500g","고구마 2개","브로콜리 1송이","올리브오일 3큰술","훈제 파프리카 1큰술","칠리 파우더 1작은술","마늘 파우더 1작은술","소금 1작은술","후추 1꼬집","라임 1개"],"cookTime":30,"difficulty":"쉬움","calories":410,"protein":28,"steps":["오븐을 200°C로 예열하고 시트팬에 종이호일을 깔아 준비한다.","닭다리살 500g은 키친타월로 물기를 제거하고 사방 3cm 한입 크기로 썰어 큰 볼에 담는다.","고구마 2개는 껍질째 깨끗이 씻어 2.5cm 큼직하게 깍둑썰고, 브로콜리 1송이는 한입 크기 송이로 분리한다.","작은 볼에 올리브오일 3큰술, 훈제 파프리카 1큰술, 칠리 파우더 1작은술, 마늘 파우더 1작은술, 소금 1작은술, 후추 1꼬집을 잘 섞어 스파이스 오일을 만든다.","닭다리살, 고구마, 브로콜리에 스파이스 오일을 골고루 나눠 부어 손으로 빠짐없이 버무린다.","시트팬에 고구마와 닭다리살을 먼저 펼쳐 담고 200°C 오븐에서 15분 굽는다.","꺼내서 브로콜리를 빈 공간에 추가하고 한 번 뒤집어준 뒤 200°C에서 10~15분 더 구워 닭이 진한 갈색이 되고 고구마가 포크로 부드럽게 들어갈 때까지 익힌다.","라임 1개를 4등분으로 잘라 따뜻한 시트팬 위에 함께 올리고 즙을 짜 골고루 뿌려 마무리한다.","1인분씩 밀프랩 용기에 담아 냉장 보관 시 3일 이내 먹는다."],"source":"https://www.youtube.com/@HealthyMealPrep","sourceName":"Healthy Meal Prep","tags":["시트팬","닭다리살","고구마","스파이시","다이어트"],"servings":4,"storageInfo":"냉장 보관 4~5일, 에어프라이어 재가열 추천"},{"name":"원팟 콩나물 돼지고기 찜","category":"additional","displayCategory":"korean","type":"one-pot","ingredients":["돼지고기 목살 400g","콩나물 400g","대파 2대","청양고추 3개","간장 3큰술","고춧가루 1큰술","다진마늘 1큰술","참기름 1큰술","맛술 2큰술","후추 1꼬집","물 200ml"],"cookTime":25,"difficulty":"쉬움","calories":380,"protein":26,"steps":["콩나물 400g은 흐르는 물에 헹궈 머리의 껍질과 잔뿌리를 정리하고 체에 받쳐 물기를 뺀다.","돼지고기 목살 400g은 0.5cm 두께로 얇게 썰어 큰 볼에 담는다.","돼지고기에 간장 3큰술, 고춧가루 1큰술, 다진마늘 1큰술, 맛술 2큰술, 후추 1꼬집을 넣고 손으로 골고루 무쳐 10분간 재운다.","대파 2대는 5cm 길이로 자른 뒤 세로로 반 갈라 두툼하게 썰고, 청양고추 3개는 0.5cm 두께 어슷 썬다.","넓고 깊은 냄비 바닥에 콩나물 절반을 평평하게 깔고 그 위에 양념한 돼지고기를 펼쳐 올린다.","남은 콩나물 절반을 다시 덮어 올리고 가장자리에 물 200ml를 부은 뒤 뚜껑을 덮는다.","센불에서 5분간 끓여 김이 강하게 올라오면 중불로 줄여 15분간 그대로 익혀 콩나물 향과 고기 양념이 섞이도록 한다.","뚜껑을 열고 대파, 청양고추, 참기름 1큰술을 넣어 위아래를 크게 한두 번만 뒤섞어 1분 더 끓인 뒤 불을 끈다.","1인분씩 따뜻한 밥과 함께 그릇에 담거나 밀프랩 용기에 나눠 담아 냉장 3일 이내 먹는다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%9B%90%ED%8C%9F%20%EC%BD%A9%EB%82%98%EB%AC%BC%20%EB%8F%BC%EC%A7%80%EA%B3%A0%EA%B8%B0%20%EC%B0%9C","sourceName":"만개의레시피 검색","tags":["원팟","돼지고기","콩나물","찜"],"servings":4,"storageInfo":"냉장 보관 3~4일, 밥과 별도 보관"},{"name":"멕시칸 치킨 퀘사디아","category":"additional","displayCategory":"mexican","type":"one-pan","ingredients":["닭가슴살 400g","또띠아 8장","모짜렐라 치즈 200g","양파 1/2개","파프리카 1개","할라피뇨 2개","타코 시즈닝 1큰술","사워크림 4큰술","살사 소스 4큰술","올리브오일 2큰술","소금 1꼬집"],"cookTime":20,"difficulty":"쉬움","calories":450,"protein":30,"steps":["닭가슴살 400g은 키친타월로 물기를 제거하고 1.5cm 한입 크기로 썰어 타코 시즈닝 1큰술과 소금 1꼬집을 뿌려 5분간 재운다.","양파 1/2개와 파프리카 1개는 0.5cm 두께로 채 썰고, 할라피뇨 2개는 0.3cm 두께로 동글게 썬다.","달군 팬에 올리브오일 2큰술을 두르고 중강불에서 닭가슴살을 4분간 겉이 노릇해지고 속까지 익도록 볶는다.","양파, 파프리카, 할라피뇨를 넣고 중불에서 2~3분간 채소가 살짝 숨이 죽고 향이 올라올 때까지 볶은 뒤 큰 볼에 옮겨 식힌다.","또띠아 8장을 도마에 펼치고 4장의 절반 면에 모짜렐라 치즈 200g의 1/8씩 깔고 볶은 속재료를 한 줌 올린 뒤 다시 치즈를 한 자밤씩 올려 나머지 또띠아로 덮는다.","팬을 깨끗이 닦고 약불로 달군 뒤 기름 없이 퀘사디아를 한 장씩 올려 뚜껑을 살짝 덮고 2~3분간 굽는다.","또띠아 바닥이 황금빛으로 노릇해지면 뒤집어 반대편도 2분간 구워 치즈가 완전히 녹도록 한다.","도마로 옮겨 1분간 식힌 뒤 피자처럼 4등분으로 자르고 사워크림 4큰술과 살사 소스 4큰술을 작은 그릇에 곁들여 따뜻할 때 먹는다."],"source":"https://www.youtube.com/@JoshuaWeissman","sourceName":"Joshua Weissman","tags":["원팬","퀘사디아","치킨","멕시칸","치즈"],"servings":4,"storageInfo":"냉장 보관 3일, 에어프라이어로 재가열하면 바삭"},{"name":"원팟 해물 순두부 덮밥","category":"additional","displayCategory":"korean","type":"one-pot","ingredients":["순두부 1팩","냉동 해물믹스 300g","달걀 2개","양파 1/2개","대파 1대","고춧가루 1큰술","국간장 1큰술","다진마늘 1큰술","참기름 1큰술","물 400ml","밥 3인분"],"cookTime":15,"difficulty":"쉬움","calories":370,"protein":26,"steps":["냉동 해물믹스 300g은 찬물에 5분간 담갔다 체에 받쳐 해동하고 물기를 충분히 뺀 뒤 키친타월로 표면 수분을 제거한다.","양파 1/2개는 0.5cm 두께로 채썰고, 대파 1대는 어슷썰어 준비한다.","달군 냄비에 참기름 1큰술을 두르고 중불에서 양파를 1분간 볶다가 해물믹스를 넣어 2분간 함께 볶아 비린내를 날린다.","고춧가루 1큰술과 다진마늘 1큰술을 넣고 30초간 볶아 고추기름을 낸 뒤 물 400ml를 붓고 센불로 끓어오르도록 가열한다.","국물이 끓어오르면 순두부 1팩을 큼직하게 숟가락으로 떠 넣고 국간장 1큰술로 간을 맞춘 다음 중불에서 3분간 더 끓여 순두부를 따뜻하게 데운다.","달걀 2개를 풀어 둘러 부은 뒤 30초간 그대로 두어 살짝 익히고 대파를 올려 한 번만 저어준 후, 따뜻한 밥 3인분 위에 부어 1인분씩 밀프랩 용기에 담는다."],"source":"https://www.10000recipe.com/recipe/list.html?q=%EC%9B%90%ED%8C%9F%20%ED%95%B4%EB%AC%BC%20%EC%88%9C%EB%91%90%EB%B6%80%20%EB%8D%AE%EB%B0%A5","sourceName":"만개의레시피 검색","tags":["원팟","해물","순두부","덮밥","간편"],"servings":3,"storageInfo":"냉장 보관 2~3일, 빠른 섭취 권장"},{"name":"회오리 오므라이스","category":"korean","displayCategory":"korean","type":"one-pan","ingredients":["밥 1공기 (200g)","달걀 3개","양파 1/4개","당근 1/4개","비엔나소시지 4~5개","버터 1큰술","케첩 2큰술","굴소스 1작은술","소금 약간","후추 약간","식용유 1큰술","파슬리가루 약간 (옵션)"],"cookTime":15,"difficulty":"중간","calories":580,"protein":24,"steps":["양파·당근은 잘게 다지고 비엔나소시지는 동전 모양으로 얇게 썬다.","팬을 중불로 달군 뒤 식용유와 버터 1/2큰술을 두르고 양파·당근·비엔나를 2~3분간 볶아 단맛을 끌어올린다.","찬밥(혹은 식힌 밥)을 넣고 주걱으로 알알이 풀어 1분간 볶은 뒤, 케첩 2큰술과 굴소스 1작은술을 넣어 새빨갛게 코팅될 때까지 볶는다.","소금·후추로 간을 맞추고 케첩밥은 접시에 럭비공 모양으로 봉긋하게 옮겨 담는다.","달걀 3개를 깨서 소금 한꼬집과 함께 풀고, 작은 체에 한 번 내려 알끈을 제거한다 (비단결 식감의 핵심).","코팅 팬을 약불로 달군 뒤 남은 버터 1/2큰술을 두르고 달걀물을 부어 가장자리부터 살살 모은다.","표면이 70% 정도 굳었을 때(반숙 상태) 젓가락 끝을 가운데에 대고 시계방향으로 살짝 휘저어 회오리 무늬를 만든다.","팬을 기울여 케첩밥 위로 회오리 달걀을 미끄러뜨려 올리고, 케첩과 파슬리가루로 마무리한다.","밀프랩 시: 케첩밥만 1인분씩 소분해 냉장 2일 보관, 회오리 달걀은 즉석 조리가 베스트(반숙 상태로는 보관 비추천)."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%ED%9A%8C%EC%98%A4%EB%A6%AC%20%EC%98%A4%EB%AC%B4%EB%9D%BC%EC%9D%B4%EC%8A%A4","sourceName":"자취요리신 simple cooking","tags":["오므라이스","계란","한그릇","케첩밥","자취요리신"],"servings":1,"storageInfo":"케첩밥만 냉장 2일 — 회오리 달걀은 즉석 조리 권장","variant":"자취요리신"},{"name":"대패삼겹살 순두부찌개","category":"korean","displayCategory":"korean","type":"one-pot","ingredients":["대패삼겹살 300g","순두부 600g (2팩)","양파 1/2개","대파 1대","청양고추 2개","달걀 2개","고춧가루 4큰술","멸치액젓 6큰술","다진마늘 1큰술","치킨스톡 1작은술","물 800ml","참기름 1큰술","후추 약간"],"cookTime":20,"difficulty":"쉬움","calories":480,"protein":32,"steps":["양파는 굵게 채썰고 대파·청양고추는 0.5cm 두께로 어슷썬다. 순두부는 봉지 그대로 준비해두면 사용 시 편리하다.","냄비를 중불로 달군 뒤 기름 없이 대패삼겹살을 펼쳐 넣어 기름이 충분히 빠질 때까지 3~4분 굽는다.","고기 기름이 자작하게 깔리면 약불로 줄이고 고춧가루 4큰술을 넣어 30초간 볶아 고추기름을 낸다(태우지 않게 주의).","양파와 다진마늘을 넣고 1분간 볶다가 멸치액젓 6큰술을 둘러 가장자리에서 부글부글 끓이며 비린내를 날린다.","물 800ml와 치킨스톡 1작은술을 붓고 강불로 한 번 끓여낸다.","순두부 600g을 통째로 부어 큼직한 덩어리째 살짝 으깨고, 5~7분간 보글보글 끓여 국물에 콩맛을 우려낸다.","대파·청양고추를 넣고 후추를 뿌린 뒤 마지막으로 달걀을 톡 깨 넣어 뚜껑을 덮고 1분간 반숙으로 익힌다.","불을 끄고 참기름 1큰술을 둘러 고소함을 끌어올리고, 그릇에 옮긴 뒤 송송 썬 쪽파나 부순 김가루를 토핑하면 비주얼이 산다.","밀프랩 시: 달걀과 대파를 빼고 끓인 본체만 1인분씩 소분해 냉장 3일 보관, 데울 때 달걀·대파를 새로 추가하면 처음 만든 맛 그대로 재현."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%EB%8C%80%ED%8C%A8%EC%82%BC%EA%B2%B9%EC%82%B4%20%EC%88%9C%EB%91%90%EB%B6%80%EC%B0%8C%EA%B0%9C","sourceName":"자취요리신 simple cooking","tags":["순두부찌개","대패삼겹살","찌개","국물요리","자취요리신"],"servings":2,"storageInfo":"냉장 3일 — 달걀·대파는 데울 때 추가","variant":"자취요리신"},{"name":"불닭떡볶이","category":"korean","displayCategory":"korean","type":"one-pan","ingredients":["불닭볶음면 2개 (면+분말스프+액상스프)","떡국떡 또는 떡볶이떡 200g","사각어묵 100g","양파 1/2개","대파 1대","고추장 1큰술","설탕 1큰술","다진마늘 1큰술","물 700ml","모짜렐라 치즈 50g (옵션)","통깨 약간"],"cookTime":15,"difficulty":"쉬움","calories":720,"protein":22,"steps":["떡이 굳어있다면 미지근한 물에 5분 불려둔다(말랑말랑 상태가 핵심).","양파는 1cm 폭으로 굵게 채썰고, 사각어묵은 대각선으로 잘라 삼각형 모양으로 만들고, 대파는 0.5cm 두께로 어슷 썬다.","넓은 팬에 물 700ml를 붓고 강불로 끓이며, 끓는 동안 불닭볶음면 액상스프 2개·분말스프 1개분·고추장 1큰술·설탕 1큰술·다진마늘 1큰술을 풀어 양념국물을 만든다(분말스프 2개는 너무 매워서 1개만 사용).","양념국물이 보글보글 끓으면 떡과 어묵, 양파를 넣고 강불에서 4분간 끓인다.","불닭볶음면 면을 통째로 넣고 가위로 한 번 잘라준 뒤, 면이 풀어지도록 젓가락으로 살살 헤집으며 3분간 더 끓인다.","국물이 자작하게 졸아들고 면이 쫄깃해지면 대파를 올려 1분간 더 끓인다.","기호에 따라 모짜렐라 치즈 50g을 올려 뚜껑을 덮고 약불에서 1분간 녹인다(매운맛 중화).","통깨를 듬뿍 뿌리고 가위로 면을 한 입 크기로 잘라 마무리한다(면이 길면 떡과 함께 먹기 불편).","밀프랩 시: 불은 면+떡 조합은 보관 비추천 — 양념국물만 따로 만들어 냉장 4일 보관 후 즉석에서 면·떡 추가 조리하면 좋다."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%EB%B6%88%EB%8B%AD%EB%96%A1%EB%B3%B6%EC%9D%B4","sourceName":"자취요리신 simple cooking","tags":["불닭","떡볶이","분식","라면","매운맛","자취요리신"],"servings":2,"storageInfo":"조리 후 보관 비추천 — 양념국물만 냉장 4일 보관 후 즉석 조리","variant":"자취요리신"},{"name":"매운 삼겹살덮밥","category":"korean","displayCategory":"korean","type":"one-pan","ingredients":["대패삼겹살 300g","양파 1/2개","청양고추 1개","대파 1/2대","달걀 2개","고추장 1큰술","고춧가루 1큰술","돈까스소스 2큰술","다진마늘 1작은술","설탕 1작은술","후추 약간","밥 1공기","참기름 1작은술","통깨 약간"],"cookTime":10,"difficulty":"쉬움","calories":720,"protein":30,"steps":["작은 볼에 고추장 1큰술·고춧가루 1큰술·돈까스소스 2큰술·다진마늘 1작은술·설탕 1작은술을 섞어 양념장을 미리 만들어둔다(돈까스소스가 자취요리신 시그니처).","양파는 1cm 폭으로 굵게 채썰고 청양고추·대파는 0.5cm 두께로 어슷썬다(고기와 함께 씹히는 식감을 위해 너무 얇게 썰지 않는다).","팬을 강불로 바짝 달군 뒤 기름 없이 대패삼겹살을 펼쳐 넣고 2분간 굽는다(불맛 포인트).","고기에 색이 80% 들어오면 양파를 넣고 1분간 함께 볶아 고기 기름에 양파를 코팅한다.","양념장을 부어 강불 그대로 1분간 빠르게 볶는다(약불에서 끓이면 양념이 늘어져 덮밥 식감이 안 남).","청양고추·대파를 넣고 30초간 더 볶아 향을 입힌 뒤 후추를 뿌리고 불을 끈다.","옆 팬에서 식용유 1큰술을 두르고 달걀 2개를 반숙 프라이로 부친다(흰자 가장자리는 바삭, 노른자는 액체).","그릇에 따끈한 밥을 담고 매운 삼겹살볶음을 한국식 산처럼 올린 뒤 반숙 달걀프라이 2개를 얹고 참기름·통깨를 뿌려 마무리한다.","밀프랩 시: 삼겹살볶음만 냉장 3일 보관 가능, 데울 때 약간의 물 1~2큰술을 추가해 양념을 풀어주면 좋다. 달걀프라이는 즉석 조리 권장."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%EB%A7%A4%EC%9A%B4%20%EC%82%BC%EA%B2%B9%EC%82%B4%EB%8D%AE%EB%B0%A5","sourceName":"자취요리신 simple cooking","tags":["삼겹살덮밥","돈까스소스","한그릇","매운맛","자취요리신"],"servings":1,"storageInfo":"삼겹살볶음 냉장 3일 — 달걀프라이는 즉석 조리","variant":"자취요리신"},{"name":"우삼겹 갈비탕","category":"korean","displayCategory":"korean","type":"one-pot","ingredients":["우삼겹 800g","당면 200g (마른 상태)","표고버섯 4개","대파 2대","양파 1개","다진마늘 4큰술","굴소스 4큰술","참치액 2큰술","국간장 1큰술","후추 약간","물 1.6L","소금 약간","달걀 2개 (옵션 — 지단용)"],"cookTime":25,"difficulty":"쉬움","calories":380,"protein":28,"steps":["당면은 미지근한 물에 30분 이상 불려 부드럽게 만들어둔다(시간이 없으면 끓는 물에 5분 데쳐도 OK).","양파는 굵게 채썰고 대파는 흰 부분과 푸른 부분을 분리해 어슷썬다. 표고버섯은 기둥을 떼고 4등분한다.","큰 냄비를 중불로 달군 뒤 기름 없이 우삼겹을 펼쳐 넣고 5분간 충분히 구워 핏물과 누린내를 날린다(이때 나온 기름은 1~2큰술만 남기고 따라낸다).","다진마늘 4큰술을 넣고 약중불에서 30초~1분간 볶아 마늘 풋내가 사라지고 고소한 향이 올라올 때까지 끌어올린다(태우면 쓴맛).","물 1.6L를 붓고 강불로 끓이다가, 끓어오르면 굴소스 4큰술·참치액 2큰술·국간장 1큰술을 넣어 자취요리신 시그니처 국물맛(굴소스+참치액)을 잡는다.","양파·표고버섯을 넣고 중불로 줄여 10분간 끓인다(이때 떠오르는 거품은 걷어내야 맑은 국물이 된다).","불려둔 당면과 대파 흰 부분을 넣고 5분간 더 끓여 당면을 익힌다.","마지막으로 대파 푸른 부분과 후추를 뿌리고 소금으로 간을 맞춘 뒤 1분간 더 끓여 불을 끈다.","기호에 따라 황·백 지단을 부쳐 채썰어 올리면 갈비탕 비주얼이 완성된다.","밀프랩 시: 당면 없이 국물+고기만 4인분으로 끓여 1인분씩 소분 냉장 4일 보관, 먹기 직전 당면을 새로 삶아 토핑하면 불지 않는다."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%EC%9A%B0%EC%82%BC%EA%B2%B9%20%EA%B0%88%EB%B9%84%ED%83%95","sourceName":"자취요리신 simple cooking","tags":["갈비탕","우삼겹","굴소스","참치액","국물요리","자취요리신"],"servings":4,"storageInfo":"당면 제외 본체만 냉장 4일 — 당면은 먹기 직전 추가","variant":"자취요리신"},{"name":"매운 삼겹찜","category":"korean","displayCategory":"korean","type":"one-pot","ingredients":["통삼겹살 1.2kg","양파 2개","대파 2대","청양고추 4개","고추장 4큰술","고춧가루 6큰술","진간장 6큰술","다진마늘 4큰술","설탕 2큰술","맛술 4큰술","굴소스 1큰술","후추 약간","물 400ml","참기름 1큰술","통깨 약간"],"cookTime":35,"difficulty":"중간","calories":540,"protein":32,"steps":["통삼겹살은 3cm 두께로 큼직하게 썰어 끓는 물에 1~2분만 데쳐 핏물과 누린내를 살짝 빼준다(완전히 익히지 말고 겉만 하얗게).","양파는 4등분으로 큼직하게 썰고 대파·청양고추는 큼직하게 어슷썬다.","볼에 고추장 4큰술·고춧가루 6큰술·진간장 6큰술·다진마늘 4큰술·설탕 2큰술·맛술 4큰술·굴소스 1큰술·후추를 섞어 양념장을 만든다(자취요리신 시그니처: 고추장+고춧가루+다진마늘 듬뿍).","두꺼운 냄비 바닥에 양파를 깔고, 그 위에 데친 삼겹살을 한 겹 올린다.","양념장의 2/3를 끼얹고 물 400ml를 부은 뒤 뚜껑을 덮고 강불로 끓인다.","한 번 끓어오르면 중약불로 줄여 20분간 푹 찐다(중간에 뚜껑을 열어 양념을 끼얹어주면 골고루 밴다).","남은 양념장 1/3을 마저 넣고 청양고추와 대파를 올린 뒤, 뚜껑을 열고 강불로 5분간 졸여 국물을 자작하게 만든다.","불을 끄고 참기름 1큰술과 통깨를 듬뿍 뿌린 뒤, 잘 익은 삼겹살을 한입 크기로 가위로 잘라 그릇에 양파·국물과 함께 담아낸다.","밀프랩 시: 통째로 만들어 4인분씩 소분 냉장 4일·냉동 2주 보관, 데울 때 물 2~3큰술 추가해 약불에서 천천히 데우면 고기가 다시 부드러워진다."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%EB%A7%A4%EC%9A%B4%20%EC%82%BC%EA%B2%B9%EC%B0%9C","sourceName":"자취요리신 simple cooking","tags":["삼겹찜","찜요리","매운맛","밥도둑","밀프랩","자취요리신"],"servings":4,"storageInfo":"냉장 4일·냉동 2주 — 데울 때 물 추가하면 부드러움 회복","variant":"자취요리신"},{"name":"돼지김치찜","category":"korean","displayCategory":"korean","type":"one-pot","ingredients":["돼지목살(또는 앞다리살) 1kg","묵은김치 1포기 (약 1kg)","양파 1개","대파 2대","다진마늘 2큰술","고춧가루 2큰술","설탕 2큰술","치킨스톡 1큰술 (또는 멸치액젓 2큰술)","맛술 3큰술","후추 약간","물 600ml","참기름 1큰술","쌀뜨물 약간 (옵션)"],"cookTime":50,"difficulty":"쉬움","calories":460,"protein":36,"steps":["묵은김치는 속을 살짝 털어내고(너무 많이 털면 맛이 빠짐) 밑동을 잘라낸 뒤 포기 모양으로 큼직하게 자른다.","돼지목살은 4cm 두께의 큼직한 덩어리로 썬다(밀프랩용은 큼직해야 식감이 살아남).","두꺼운 냄비 바닥에 묵은김치 절반을 깔고 그 위에 돼지고기를 올린 뒤, 다진마늘·설탕·고춧가루·후추를 골고루 뿌린다.","남은 김치를 한 번 더 덮어 샌드위치처럼 만들고, 양파를 굵게 채썰어 올린다.","맛술 3큰술·치킨스톡 1큰술을 붓고, 물 600ml(쌀뜨물이면 더 좋음)를 김치가 자작하게 잠길 만큼 붓는다.","뚜껑을 덮고 강불로 끓이다가 끓어오르면 중약불로 줄여 30분간 뭉근히 끓인다.","30분 뒤 뚜껑을 열고 김치 위아래를 한 번 뒤집어 양념이 골고루 배도록 한 뒤, 다시 뚜껑을 덮고 10분간 더 끓인다.","대파를 어슷썰어 올리고 뚜껑을 연 채 강불로 3~5분간 졸여 국물을 살짝 진하게 만든다.","참기름 1큰술을 둘러 향을 살리고 그릇에 김치-고기 순서로 차곡차곡 담는다.","밀프랩 시: 일주일 반찬 컨셉 — 4인분 소분해 냉장 6일·냉동 3주 보관, 보관할수록 김치가 더 부드러워지고 고기에 양념이 진하게 배어든다(2일 차가 가장 맛있음)."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%EB%8F%BC%EC%A7%80%EA%B9%80%EC%B9%98%EC%B0%9C","sourceName":"자취요리신 simple cooking","tags":["김치찜","묵은지","돼지고기","밀프랩","일주일반찬","자취요리신"],"servings":4,"storageInfo":"냉장 6일·냉동 3주 — 2일 차가 가장 맛있음","variant":"자취요리신"},{"name":"만두짜글이","category":"korean","displayCategory":"korean","type":"one-pot","ingredients":["냉동만두 12개 (왕만두 또는 고기만두)","양파 1/2개","팽이버섯 1봉","청양고추 1개","대파 1/2대","고추장 1큰술","고춧가루 1큰술","진간장 2큰술","다진마늘 1큰술","설탕 1작은술","치킨스톡 1/2작은술","물 400ml","참기름 약간","후추 약간"],"cookTime":12,"difficulty":"쉬움","calories":520,"protein":22,"steps":["냉동만두는 해동하지 않은 상태로 그대로 사용한다(해동하면 풀어져 짜글이가 흐물해짐).","양파는 굵게 채썰고 팽이버섯은 밑동을 자른 뒤 가닥가닥 풀어준다. 청양고추·대파는 어슷썬다.","작은 냄비에 물 400ml를 붓고 고추장 1큰술·고춧가루 1큰술·진간장 2큰술·다진마늘 1큰술·설탕 1작은술·치킨스톡 1/2작은술을 풀어 양념국물을 만든다(자취요리신 시그니처: 고추장+고춧가루+다진마늘).","강불에 올려 한 번 보글보글 끓인 뒤, 양파를 먼저 넣고 1분간 끓여 단맛을 우려낸다.","냉동만두를 통째로 넣고 중강불에서 5분간 끓이면서 만두피가 부풀어 양념이 배도록 국물을 끼얹어준다.","팽이버섯을 듬뿍 넣고 2분간 더 끓인다(팽이가 국물을 머금어 짜글짜글한 식감을 살림).","국물이 자작하게 졸아들면 청양고추·대파를 올리고 후추를 뿌린 뒤 30초간 더 끓여 불을 끈다.","참기름 약간을 둘러 향을 입히고 그릇째 식탁에 옮겨 밥과 함께 떠먹는다(밥도둑 모드).","밀프랩 시: 만두피가 불어 보관에 약함 — 양념국물만 미리 만들어 냉장 5일 보관 후, 먹을 때 냉동만두를 새로 끓여 합치는 방식 추천."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%EB%A7%8C%EB%91%90%EC%A7%9C%EA%B8%80%EC%9D%B4","sourceName":"자취요리신 simple cooking","tags":["만두짜글이","냉동만두","찌개","1인분","자취요리신"],"servings":1,"storageInfo":"조리 후 보관 비추천 — 양념국물만 냉장 5일, 만두는 즉석 조리","variant":"자취요리신"},{"name":"베이컨 대파 볶음밥","category":"korean","displayCategory":"korean","type":"one-pan","ingredients":["찬밥 1공기 (200g)","베이컨 4~5줄 (약 80g)","대파 1대 (흰 부분 위주)","달걀 1개","진간장 1큰술","굴소스 1작은술","후추 약간","식용유 2큰술","참기름 1작은술","통깨 약간","김가루 약간 (옵션)"],"cookTime":12,"difficulty":"쉬움","calories":620,"protein":20,"steps":["대파 1대는 흰 부분 위주로 송송 썬다(파기름의 핵심 — 푸른 부분은 마지막 토핑용으로 따로 빼둔다).","베이컨은 1cm 폭으로 썰어 찬 팬에 올린 뒤 약불부터 시작해 베이컨 기름을 천천히 우려낸다(약불부터 시작이 포인트).","베이컨이 노릇해지면 베이컨만 건져두고, 팬에 남은 베이컨 기름에 식용유 2큰술을 추가한 뒤 송송 썬 대파 흰 부분을 모두 넣어 약불에서 3~4분간 천천히 볶아 파기름을 낸다(파가 짙은 갈색이 되면 OK).","파기름이 충분히 우러나면 중불로 올리고 찬밥 한 공기를 넣어 주걱으로 알알이 풀어 1분간 볶는다(찬밥이어야 고슬고슬해짐).","팬 한쪽으로 밥을 밀어두고 빈 자리에 달걀 1개를 깨 넣어 살짝 풀어준 뒤, 반숙 상태에서 밥과 합쳐 비빈다.","구워둔 베이컨을 다시 넣고 진간장 1큰술을 팬 가장자리에 둘러 살짝 태운 향을 입힌 뒤, 굴소스 1작은술을 더해 강불에서 1분간 빠르게 볶는다.","후추를 뿌리고 불을 끈 뒤 참기름 1작은술을 시계방향으로 둘러 향을 입히고 잔열로 30초간 더 볶아 마무리한다.","그릇에 봉긋하게 담고 빼뒀던 대파 푸른 부분과 통깨, 김가루를 뿌린다(15분 만들고 5분 만에 끝나는 자취요리신 컨셉).","밀프랩 시: 1인분씩 소분해 냉장 3일 보관, 데울 때 식용유 1/2작은술을 추가해 팬에 다시 볶으면 처음의 고슬고슬함이 살아남."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%EB%B2%A0%EC%9D%B4%EC%BB%A8%20%EB%8C%80%ED%8C%8C%20%EB%B3%B6%EC%9D%8C%EB%B0%A5","sourceName":"자취요리신 simple cooking","tags":["볶음밥","베이컨","대파","파기름","한그릇","자취요리신"],"servings":1,"storageInfo":"냉장 3일 — 데울 때 팬에 다시 볶으면 좋음","variant":"자취요리신"},{"name":"깻잎 참치 비빔밥","category":"korean","displayCategory":"korean","type":"standard","ingredients":["밥 1공기 (200g)","참치캔 1개 (150g)","깻잎 7장","달걀 1개","고추장 1큰술","다진마늘 1/2작은술","식초 1작은술","설탕 1/2작은술","참기름 1큰술","통깨 약간","식용유 1작은술","김가루 약간 (옵션)"],"cookTime":6,"difficulty":"쉬움","calories":560,"protein":28,"steps":["참치캔은 뚜껑을 살짝 열고 손가락으로 눌러 기름을 꾹 짜낸다(기름이 남아있으면 비린맛이 도드라짐).","깻잎 7장은 차곡차곡 포개어 돌돌 만 뒤 잘게 채썬다(향이 가장 강해지는 컷팅법).","작은 볼에 기름 짜낸 참치·고추장 1큰술·다진마늘 1/2작은술·식초 1작은술·설탕 1/2작은술을 섞어 새콤매콤 참치고추장 양념을 만든다.","팬에 식용유 1작은술을 두르고 약불로 달군 뒤 달걀 1개를 깨 넣어 노른자 반숙으로 부친다(가장자리는 살짝 바삭).","그릇에 따끈한 밥을 담고 한쪽에 참치고추장 양념을, 반대편에 채썬 깻잎을 수북이 올린다.","가운데에 반숙 달걀프라이를 얹고 참기름 1큰술을 시계방향으로 둘러준다(자취요리신 5분 컷 비빔밥 시그니처).","통깨와 김가루를 듬뿍 뿌려 비주얼을 살리고, 추가로 매콤함이 부족하면 고추장 1/2작은술 더 추가해 마무리한다.","먹기 직전 숟가락으로 노른자를 터뜨려 모든 재료를 골고루 비비면 깻잎향+참치고추장의 시너지가 폭발한다.","밀프랩 시: 참치고추장 양념만 미리 만들어 냉장 4일 보관 가능, 깻잎과 달걀은 신선도가 중요하므로 즉석 조리 권장."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%EA%B9%BB%EC%9E%8E%20%EC%B0%B8%EC%B9%98%20%EB%B9%84%EB%B9%94%EB%B0%A5","sourceName":"자취요리신 simple cooking","tags":["비빔밥","참치","깻잎","5분요리","한그릇","자취요리신"],"servings":1,"storageInfo":"참치고추장만 냉장 4일 — 깻잎·달걀은 즉석 조리","variant":"자취요리신"},{"name":"매운 크림새우 우동","category":"korean","displayCategory":"korean","type":"one-pan","ingredients":["냉동새우 150g (중하 사이즈)","우동면 1봉 (200g)","양파 1/4개","마늘 4쪽 (편썰기)","버터 1큰술","고춧가루 2큰술","고추장 1/2큰술","우유 300ml","체다치즈 1장 (20g)","모짜렐라 치즈 50g","소금 약간","후추 약간","파슬리가루 약간 (옵션)"],"cookTime":15,"difficulty":"중간","calories":720,"protein":32,"steps":["냉동새우는 찬물에 5분 담가 해동한 뒤 키친타월로 물기를 꼼꼼히 닦아낸다(물기 있으면 양념이 묽어짐).","마늘은 편썰기, 양파는 잘게 다지고, 우동면은 끓는 물에 1분만 데쳐 찬물에 한 번 헹궈둔다(전분기 제거가 크림소스 핵심).","팬을 중불로 달군 뒤 버터 1큰술을 녹이고 편썬 마늘과 양파를 1분간 볶아 갈릭버터 향을 낸다.","약불로 줄이고 고춧가루 2큰술을 넣어 30초간 볶아 매운 고추기름을 낸다(태우지 않게 30초만).","고추장 1/2큰술을 넣고 30초간 더 볶아 양념의 풋내를 날린 뒤, 우유 300ml를 천천히 부으며 거품기로 풀어준다(자취요리신 시그니처: 우유+고추장 로제 베이스).","약중불에서 보글보글 2~3분간 끓여 소스가 살짝 걸쭉해지면 새우를 넣고 2분간 익힌다(새우가 핑크빛으로 변하면 OK).","체다치즈 1장과 모짜렐라 치즈 50g을 넣고 녹을 때까지 거품기로 저어준다(꾸덕한 크림 식감의 비밀).","데쳐둔 우동면을 넣고 소스에 30초~1분간 코팅하듯 버무린다(오래 끓이면 면이 불어 늘어짐).","소금·후추로 간을 맞추고 그릇에 옮긴 뒤 파슬리가루를 솔솔 뿌려 마무리한다.","밀프랩 시: 크림소스+새우만 따로 끓여 냉장 2일 보관, 우동면은 먹기 직전 새로 데쳐서 합치면 면이 불지 않는다."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%EB%A7%A4%EC%9A%B4%20%ED%81%AC%EB%A6%BC%EC%83%88%EC%9A%B0%20%EC%9A%B0%EB%8F%99","sourceName":"자취요리신 simple cooking","tags":["크림우동","새우","로제","퓨전","치즈","자취요리신"],"servings":1,"storageInfo":"소스+새우만 냉장 2일 — 우동면은 즉석 데치기","variant":"자취요리신"},{"name":"얼큰 어묵탕","category":"korean","displayCategory":"korean","type":"one-pot","ingredients":["사각어묵 400g","무 200g","대파 2대","양파 1개","청양고추 2개","다진마늘 2큰술","고춧가루 4큰술","굴소스 2큰술","참치액 1큰술","국간장 1큰술","치킨스톡 1작은술 (또는 멸치다시팩 1개)","물 1.4L","후추 약간","어묵꼬치 4개 (옵션)"],"cookTime":20,"difficulty":"쉬움","calories":220,"protein":18,"steps":["무는 0.7cm 두께로 나박썰고 양파는 굵게 채썬다. 대파는 흰 부분과 푸른 부분을 분리해 어슷썬다.","사각어묵은 끓는 물에 30초간 데쳐 기름기를 빼고 삼각형 또는 한 입 크기로 썬다(데치는 과정을 생략하면 국물이 기름지고 텁텁해짐).","큰 냄비에 물 1.4L를 붓고 무·치킨스톡 1작은술을 넣어 강불로 10분간 끓여 무 육수를 우려낸다(자취요리신 시그니처: 굴소스+참치액 조합 직전 단계).","무가 반투명해지면 약불로 줄이고 고춧가루 4큰술을 넣어 30초간 풀어준다(끓는 국물에 고춧가루를 직접 넣으면 풋내가 사라짐).","굴소스 2큰술·참치액 1큰술·국간장 1큰술·다진마늘 2큰술을 넣고 다시 강불로 5분간 끓여 매콤한 국물 베이스를 완성한다.","양파와 데친 어묵을 넣고 중불에서 5분간 끓여 어묵에 양념이 배도록 한다.","대파 흰 부분과 청양고추를 넣고 2분간 더 끓여 매콤함을 끌어올린다.","마지막으로 대파 푸른 부분과 후추를 뿌리고 30초간 끓여 향을 살린다(분식점 어묵탕을 매콤하게 변형한 자취요리신 컨셉).","어묵꼬치를 사용한 경우 그릇에 4개씩 담고 국물을 듬뿍 부어 마무리한다.","밀프랩 시: 4인분 소분해 냉장 4일 보관, 끓일수록 어묵에 국물이 더 진하게 배어 2일 차가 가장 맛있다(데울 때 대파만 새로 추가하면 신선도 회복)."],"source":"https://www.youtube.com/results?search_query=%EC%9E%90%EC%B7%A8%EC%9A%94%EB%A6%AC%EC%8B%A0%20%EC%96%BC%ED%81%B0%20%EC%96%B4%EB%AC%B5%ED%83%95","sourceName":"자취요리신 simple cooking","tags":["어묵탕","분식","매운맛","굴소스","참치액","자취요리신"],"servings":4,"storageInfo":"냉장 4일 — 2일 차가 가장 맛있음, 데울 때 대파만 새로 추가","variant":"자취요리신"},{"name":"김치찌개","category":"korean","displayCategory":"korean","type":"one-pot","ingredients":["대패삼겹살 250g","묵은지 2컵","김치국물 1/2컵","두부 1/2모","양파 1/2개","대파 1대","청양고추 1개","다진마늘 1큰술","고춧가루 1큰술","굴소스 1큰술","참치액 1큰술","설탕 1작은술","물 3컵"],"cookTime":20,"difficulty":"쉬움","calories":480,"protein":28,"steps":["냄비를 센불로 달군 뒤 기름 없이 대패삼겹살을 펼쳐 넣고 30초간 짧게 볶아 누린내를 날린다.","기름이 살짝 나오면 묵은지와 고춧가루를 함께 넣고 2분간 볶아 김치 가장자리를 노릇하게 익힌다.","다진마늘과 설탕을 넣고 30초 더 볶아 마늘향과 단맛을 끌어올린다.","물 3컵과 김치국물 1/2컵을 부어 강불에서 한소끔 끓인다.","끓어오르면 굴소스 1큰술과 참치액 1큰술을 넣어 다시다 없이 깊은 감칠맛을 낸다.","양파를 큼직하게 썰어 넣고 중불로 줄여 8분간 끓여 국물을 진하게 우린다.","두부를 두툼하게 썰어 넣고 3분간 더 끓인다.","마지막으로 대파와 청양고추를 올리고 1분 끓여 불을 끈다.","용기에 소분하고 한 김 식힌 뒤 냉장 보관한다 — 다음날 더 깊은 맛이 난다."],"source":"https://www.youtube.com/results?search_query=자취요리신+김치찌개","sourceName":"자취요리신 simple cooking","tags":["김치찌개","대패삼겹","자취요리신","원팟","굴소스"],"servings":2,"storageInfo":"냉장 3일 — 재가열 시 더 깊은 맛","variant":"자취요리신 (대패삼겹)"},{"name":"김치볶음밥","category":"korean","displayCategory":"korean","type":"one-pan","ingredients":["묵은지 1.5컵","김치국물 2큰술","스팸 100g","찬밥 2공기","달걀 2개","대파 1/2대","다진마늘 1작은술","설탕 1작은술","버터 10g","진간장 1작은술","참기름 1작은술","김가루 약간","식용유 1큰술"],"cookTime":15,"difficulty":"쉬움","calories":560,"protein":22,"steps":["묵은지를 잘게 썰고 스팸은 작게 깍둑썰기, 대파는 송송 썬다.","팬에 식용유를 두르고 스팸을 센불로 1분 노릇하게 볶아 기름을 낸다.","다진마늘과 대파 흰부분을 넣어 30초 볶아 자취요리신식 파기름을 만든다.","묵은지를 넣고 김치국물 2큰술과 설탕을 더해 2분간 양념째 푹 볶는다 — 김치를 따로 양념하지 않는다.","찬밥을 넣고 김치 양념을 코팅하듯 으깨가며 센불에서 2분 볶는다.","팬 가장자리에 버터 10g을 녹이고 그 위에 진간장 1작은술을 둘러 살짝 태운 뒤 밥과 섞는다 — 자취요리신 풍미 빌딩 핵심.","참기름을 두르고 30초 더 볶아 불향을 입힌다.","다른 팬에 달걀프라이를 반숙으로 부친다.","용기에 볶음밥을 담고 김가루와 대파 푸른부분을 올린다.","달걀프라이는 먹기 직전 별도 보관 후 올린다."],"source":"https://www.youtube.com/results?search_query=자취요리신+김치볶음밥","sourceName":"자취요리신 simple cooking","tags":["김치볶음밥","자취요리신","원팬","버터간장","스팸"],"servings":2,"storageInfo":"냉장 2일 — 달걀은 먹기 직전 조리","variant":"자취요리신"},{"name":"잡채","category":"korean","displayCategory":"korean","type":"one-pan","ingredients":["당면 200g","돼지고기 채끝 200g","양파 1/2개","당근 1/3개","대파 1대","표고버섯 3개","시금치 한 줌","다진마늘 1큰술","진간장 3큰술","돈까스소스 2큰술","굴소스 1작은술","설탕 1큰술","참기름 1큰술","후추 약간","물 2컵"],"cookTime":20,"difficulty":"쉬움","calories":520,"protein":24,"steps":["당면은 미리 삶지 않고 마른 상태로 둔다 — 한 팬에서 흡수 조리 (자취요리신 원팬 핵심).","양파·당근·대파·표고는 굵게 채썰고 돼지고기는 채끝으로 썬다.","달군 팬에 참기름을 두르고 돼지고기와 다진마늘을 센불에서 2분 볶아 후추로 잡내를 잡는다.","양파·당근·표고를 넣고 1분 더 볶아 채소 단맛을 끌어올린다.","물 2컵을 붓고 진간장 3큰술, 돈까스소스 2큰술, 굴소스 1작은술, 설탕 1큰술을 풀어 끓인다.","끓어오르면 마른 당면을 그대로 넣고 양념물에 잠기도록 누른다.","중불에서 6~7분간 당면이 양념물을 빨아들이도록 가끔 뒤집는다.","국물이 거의 없어지면 시금치를 넣고 30초 숨만 죽인다.","대파를 넣고 참기름 1큰술을 둘러 1분 마무리 볶음 — 돈까스소스의 단감칠이 핵심.","용기에 소분해 한 김 식힌 뒤 냉장 보관한다."],"source":"https://www.youtube.com/results?search_query=자취요리신+잡채","sourceName":"자취요리신 simple cooking","tags":["잡채","자취요리신","원팬","돈까스소스","당면"],"servings":3,"storageInfo":"냉장 3일 — 데울 때 참기름 한 방울 추가","variant":"자취요리신 (원팬)"},{"name":"된장찌개","category":"korean","displayCategory":"korean","type":"one-pot","ingredients":["된장 2큰술","다진마늘 1큰술","멸치액젓 1/2큰술","돼지고기 다짐육 100g","두부 1/2모","애호박 1/3개","양파 1/4개","감자 1/2개","청양고추 1개","대파 1/2대","고춧가루 1작은술","참기름 1작은술","쌀뜨물 또는 물 3컵"],"cookTime":18,"difficulty":"쉬움","calories":320,"protein":22,"steps":["깡장을 먼저 만든다 — 된장 2큰술 + 다진마늘 1큰술 + 멸치액젓 1/2큰술을 잘 섞어 둔다 (고깃집 된장 시그니처).","뚝배기에 참기름을 두르고 돼지 다짐육을 센불에서 1분 볶아 기름을 낸다.","고춧가루 1작은술을 넣고 30초 볶아 고추기름을 만든다.","쌀뜨물 3컵을 붓고 강불로 한소끔 끓인다.","감자를 깍둑썰어 먼저 넣고 4분간 끓여 반쯤 익힌다.","준비한 깡장을 체에 받쳐 풀어 넣어 거친 입자 없이 매끄럽게 한다.","양파와 애호박을 넣고 중불에서 5분 끓여 국물을 진하게 우린다.","두부를 큼직하게 썰어 넣고 3분 더 끓인다.","청양고추와 대파를 올리고 1분 끓인 뒤 불을 끈다 — 멸치액젓이 다시다 없이 고깃집 풍미를 완성.","뚝배기째 또는 용기에 소분해 보관한다."],"sour function findSubstitutes(itemName){
if(!itemName) return null;
if(SUBSTITUTES[itemName]) return SUBSTITUTES[itemName];
const stripped = itemName.replace(/\s*\([^)]*\)\s*/g, '').trim();
if(stripped && stripped !== itemName && SUBSTITUTES[stripped]) return SUBSTITUTES[stripped];
return null;
}

const VOLUME_UNITS = new Set(['g','kg','ml','L','컵','큰술','작은술']);

function appendWeight(itemName, amount){
if(!amount || !itemName) return amount;
const m = amount.match(/^(\d+(?:\.\d+)?(?:\/\d+)?)\s*(.*)$/);
if(!m) return amount;
const numStr = m[1];
let unit = m[2].trim();
const trailing = unit.match(/\s*\([^)]*\)\s*$/);
const trailingText = trailing ? trailing[0] : '';
unit = unit.replace(/\s*\([^)]*\)\s*/g, '').trim().replace(/\s*[+&].*$/, '').trim();
if(VOLUME_UNITS.has(unit)) return amount;
const stripped = itemName.replace(/\s*\([^)]*\)\s*/g, '').trim();
const hint = WEIGHT_HINTS[itemName] || WEIGHT_HINTS[stripped];
if(!hint || !(unit in hint)) return amount;
let num;
if(numStr.includes('/')){
const [a,b] = numStr.split('/').map(Number);
num = a/b;
} else {
num = parseFloat(numStr);
}
if(isNaN(num)) return amount;
const totalG = Math.round(num * hint[unit]);
const display = (Number.isInteger(num) ? num : (Math.round(num*100)/100)) + unit;
return display + trailingText + ' (약 ' + totalG + 'g)';
}

function animateCounters(){
  document.querySelectorAll('.stat-value').forEach(el=>{
    const text=el.textContent;
    const num=parseFloat(text);
    if(isNaN(num))return;
    const suffix=text.replace(String(num),'');
    const duration=1500;
    const start=performance.now();
    const step=(now)=>{
      const progress=Math.min((now-start)/duration,1);
      const eased=1-Math.pow(1-progress,3);
      const current=num*eased;
      el.textContent=(num%1===0?Math.floor(current):current.toFixed(1))+suffix;
      if(progress<1)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function observeCards(){

    entries.forEach((entry,i) => {
      if(entry.isIntersecting){

}

function getWeekLabel(){

function isSideDish(r){
// 반찬/밑반찬: 메인 식사로 부적합한 레시피 제외
const exclude = ['시금치나물','멸치볶음','어묵볶음','계란장조림','두부조림','닭가슴살 볶음고추장'];
if(exclude.includes(r.name)) return true;
// 칼로리 250 미만 + 반찬/밑반찬/나물 태그
const tags = (r.tags||[]).map(t=>t.toLowerCase());
const sideTags = ['반찬','밑반찬','나물'];
if(r.calories <= 250 && tags.some(t => sideTags.includes(t))) return true;
// 국/찌개 단독은 한 끼로 부족 (칼로리 200 이하)
if(r.calories <= 200) return true;
return false;
}

function generateWeeklyPlan(mode){
const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
const meals = ['lunch','dinner'];
// 메뉴명 기준 dedup: 같은 이름의 변형은 한 번만 풀에 포함
const dedupByName = arr => {
const seen = new Set();
return arr.filter(r => { if(seen.has(r.name)) return false; seen.add(r.name); return true; });
};
let pool = dedupByName(DATA.recipes.filter(r => !isSideDish(r)));

if(mode === 'korean') pool = pool.filter(r => r.displayCategory === 'korean' || r.category === 'korean');
if(mode === 'highprotein') pool = pool.filter(r => r.protein >= 30);
if(mode === 'quick') pool = pool.filter(r => r.cookTime <= 20);

if(pool.length < 7) pool = dedupByName(DATA.recipes.filter(r => !isSideDish(r)));

const plan = {};

if(mode === 'quick'){
// 초간편: 중복 허용, 5~7개 레시피를 돌려쓰기
const shuffled = [...pool].sort(() => Math.random() - 0.5);
const picks = shuffled.slice(0, Math.min(7, shuffled.length));
let idx = 0;
days.forEach(day => {
plan[day] = {
lunch: picks[idx % picks.length].name,
dinner: picks[(idx+1) % picks.length].name
};
idx += 2;
});
} else {
// 일반: 14끼 비중복, 카테고리 분산
const shuffled = [...pool].sort(() => Math.random() - 0.5);
const used = new Set();
days.forEach(day => {
plan[day] = {};
meals.forEach(meal => {
const pick = shuffled.find(r => !used.has(r.name));
if(pick){ plan[day][meal] = pick.name; used.add(pick.name); }
});
});
}
return plan;
}

function classifyIngredient(ingredient){

function parseAmount(amtStr){
if(!amtStr || amtStr === '적당량') return null;
const m = amtStr.match(/^(\d+(?:\.\d+)?(?:\/\d+)?)\s*(.*)$/);
if(!m) return null;
let numStr = m[1];
let unit = m[2].trim();
unit = unit.replace(/\s*\([^)]*\)\s*/g, '').trim();
unit = unit.replace(/\s*[+&].*$/, '').trim();
let num;
if(numStr.includes('/')){
const [a,b] = numStr.split('/').map(Number);
num = a/b;
} else {
num = parseFloat(numStr);
}
if(isNaN(num)) return null;
return {num, unit};
}

function sumAmounts(amounts, itemName){
const byUnit = {};
const order = [];
let freeformCount = 0;
amounts.forEach(a => {
const parsed = parseAmount(a);
if(!parsed){ freeformCount++; return; }
if(!(parsed.unit in byUnit)){ byUnit[parsed.unit] = 0; order.push(parsed.unit); }
byUnit[parsed.unit] += parsed.num;
});
const parts = order.map(u => {
const n = byUnit[u];
const display = Number.isInteger(n) ? n : Math.round(n*10)/10;
const part = display + (u ? u : '');
return itemName ? appendWeight(itemName, part) : part;
});
if(freeformCount > 0) parts.push('적당량');
return parts.length ? parts.join(' + ') : '적당량';
}

// 재료 분량 스케일: 원본 amount × scale (배치 수, 정수)
// 예) 레시피 3인분, 식단표 2회 등장 → ceil(2/3)=1배치 → 양 그대로
// 예) 레시피 3인분, 식단표 4회 등장 → ceil(4/3)=2배치 → 양 ×2
function scaleAmount(amtStr, scale){
if(!amtStr || amtStr === '적당량' || Math.abs(scale - 1) < 0.001) return amtStr;
const m = amtStr.match(/^(\d+(?:\.\d+)?(?:\/\d+)?)(.*)$/);
if(!m) return amtStr;
const numStr = m[1];
const rest = m[2];
let num;
if(numStr.includes('/')){
const [a,b] = numStr.split('/').map(Number);
num = a/b;
} else {
num = parseFloat(numStr);
}
if(isNaN(num)) return amtStr;
const scaled = num * scale;
if(scaled < 0.05) return '약간';
const display = Number.isInteger(scaled) ? scaled : Math.round(scaled*100)/100;
return display + rest;
}

function generateShoppingList(){
const activePlan = getActiveWeeklyPlan();
const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
const meals = ['lunch','dinner'];
const categorized = {meat:[],vegetable:[],dairy:[],grain:[],sauce:[],etc:[]};
const seen = {meat:{},vegetable:{},dairy:{},grain:{},sauce:{},etc:{}};

// 1) 식단표에서 각 레시피의 등장 횟수 집계 (= 필요한 인분 수)
const occurrences = {};
days.forEach(day => {
const plan = activePlan[day];
if(!plan) return;
meals.forEach(meal => {
const name = plan[meal];
if(name) occurrences[name] = (occurrences[name] || 0) + 1;
});
});

// 2) 레시피별로 한 번만 처리하면서 amount를 스케일
Object.entries(occurrences).forEach(([recipeName, count]) => {
const recipe = DATA.recipes.find(r => r.name === recipeName);
if(!recipe) return;
const servings = recipe.servings || 1;
// 배치 단위 올림: 분수 배치는 실제로 만들 수 없으므로 1배치 단위로 올림
// (필요 인분 ≤ 배치 인분 → 1배치, 잉여는 다음 끼/도시락으로 활용)
const scale = Math.ceil(count / servings);
recipe.ingredients.forEach(ing => {
const cat = classifyIngredient(ing);
const match = ing.match(/^(.+?)\s+(\d[\d\/\.]*\s*.+)$/);
let itemName = ing;
let amount = '';
if(match){
itemName = match[1].trim();
amount = scaleAmount(match[2].trim(), scale);
}
const stripped = itemName.replace(/\s*\([^)]*\)\s*/g, '').trim();
const canonical = SHOP_ALIASES[itemName] || SHOP_ALIASES[stripped] || stripped || itemName;
if(seen[cat][canonical]){
seen[cat][canonical].amounts.push(amount || '적당량');
} else {
seen[cat][canonical] = {item: canonical, amounts: [amount || '적당량']};
}
});
});

const result = {};
Object.keys(categorized).forEach(cat => {
result[cat] = Object.values(seen[cat]).map(entry => ({
item: entry.item,
amount: sumAmounts(entry.amounts, entry.item)
}));
});
return result;
}

function renderShopping(){
const cats = ['meat','vegetable','dairy','grain','sauce','etc'];
const shoppingData = generateShoppingList();
// 식단표 끼니 수 계산 (안내 문구용)
const activePlan = getActiveWeeklyPlan();
const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
let mealCount = 0;
days.forEach(day => {
const plan = activePlan[day];
if(!plan) return;
['lunch','dinner'].forEach(meal => { if(plan[meal]) mealCount++; });
});
let html = `<div class="shop-info">📋 이번 주 <strong>${mealCount}끼</strong> 분 <strong>최소 구매량</strong>입니다 — 각 레시피를 한 배치(인분 단위)로 만들 수 있도록 올림 환산했어요. <span class="shop-info-sub">레시피 인분이 끼니 수보다 많으면 <strong>잉여 분량은 다음 식사·도시락으로 활용</strong>하세요.</span></div>`;
cats.forEach(cat => {
const items = shoppingData[cat] || [];
if(items.length === 0) return;
html += `<div class="shopping-category">
<div class="shopping-header" onclick="toggleShop(this)">
<span>${SHOP_ICONS[cat]} ${SHOP_NAMES[cat]} (${items.length})</span>
<span class="arrow">▼</span>
</div>
<div class="shopping-items">${items.map((it,i) => {
const subs = findSubstitutes(it.item);
const subHtml = subs ? `<div class="shop-sub">↪ 대체 가능: ${subs.join(', ')}</div>` : '';
return `<div class="shopping-item" id="shop-${cat}-${i}">
<div class="shop-row">
<input type="checkbox" id="cb-${cat}-${i}" onchange="toggleCheck(this)">
<label for="cb-${cat}-${i}">${it.item}</label>
<span class="amount">${it.amount}</span>
</div>
${subHtml}
</div>`;
}).join('')}</div>
</div>`;
});
document.getElementById('shoppingSection').innerHTML = html;
}

{title:'은행잎썰기 (무·당근)', body:'반달썰기 한 조각을 다시 한 번 세로로 갈라 부채꼴 4등분으로 만드는 방법입니다. 단면이 작아 빨리 익으므로 뭇국·갈비탕·곰탕에 들어가는 무와 당근에 가장 잘 어울립니다.', tip:'두께를 균일하게 유지해야 국물이 탁해지지 않으니, 뾰족한 모서리는 살짝 다듬어 주면 더욱 깔끔합니다.', svg:'<svg viewBox="0 0 100 100"><g fill="#f39c12" stroke="#b9770e" stroke-width="1.5"><path d="M 22 36 A 24 24 0 0 1 46 60 L 22 60 Z"/><path d="M 56 36 A 24 24 0 0 1 80 60 L 56 60 Z"/></g></svg>', videoQuery:'무 은행잎썰기'},
{title:'결 따라·결 반대로 썰기 (육류)', body:'고기를 자르기 전에 근섬유의 결이 어느 방향으로 흐르는지 먼저 확인합니다. 구이용은 결을 따라 길게 썰어 형태와 식감을 유지하고, 국·볶음·장조림용은 결과 직각이 되도록 썰어야 부드러워집니다.', tip:'불고기·차돌박이·장조림은 반드시 결 반대 방향으로 잘라야 질긴 식감 없이 입에서 부드럽게 풀립니다.', svg:'<svg viewBox="0 0 100 100"><rect x="14" y="22" width="72" height="36" rx="4" fill="#c0392b"/><line x1="20" y1="30" x2="80" y2="30" stroke="#922b21" stroke-width="1.2"/><line x1="20" y1="38" x2="80" y2="38" stroke="#922b21" stroke-width="1.2"/><line x1="20" y1="46" x2="80" y2="46" stroke="#922b21" stroke-width="1.2"/><line x1="50" y1="68" x2="50" y2="92" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="4 2"/></svg>', videoQuery:'고기 결 따라 썰기'},
{title:'칼 잡는 법 (Pinch Grip)', body:'엄지와 검지로 칼날의 시작 부분을 살짝 집듯이 잡고, 나머지 세 손가락으로 손잡이를 가볍게 감싸는 방식입니다. 손과 칼이 한 몸처럼 움직여 정밀한 컨트롤이 가능해집니다.', tip:'손잡이만 움켜쥐면 손목이 흔들려 두께가 들쭉날쭉해지고 손목에도 무리가 가므로, 칼날을 살짝 집어 잡는 습관을 들이는 것이 좋습니다.', svg:'<svg viewBox="0 0 100 100"><rect x="12" y="56" width="34" height="14" rx="3" fill="#34495e"/><polygon points="46,57 92,60 92,66 46,69" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="0.8"/><circle cx="42" cy="50" r="7" fill="#fdebd0" stroke="#e8a87c" stroke-width="1.2"/><circle cx="50" cy="50" r="7" fill="#fdebd0" stroke="#e8a87c" stroke-width="1.2"/></svg>', videoQuery:'요리사 칼 잡는법 핀치그립'},
{title:'손가락 보호 (Cat Claw)', body:'재료를 잡는 손은 손가락 끝을 안쪽으로 구부려 마치 고양이 발처럼 만든 다음, 손톱 쪽이 칼의 옆면에 닿도록 가이드합니다. 칼날이 손톱 첫 마디 이상으로 올라오지 않으므로 베일 위험이 크게 줄어듭니다.', tip:'손끝을 펴고 자르면 매번 칼날을 의식해야 하지만, 고양이 발 자세는 자연스럽게 안전한 거리를 유지해 줍니다.', svg:'<svg viewBox="0 0 100 100"><g fill="#fdebd0" stroke="#e8a87c" stroke-width="1.5"><path d="M 28 78 Q 28 48 36 48 Q 44 48 44 78 Z"/><path d="M 46 78 Q 46 42 54 42 Q 62 42 62 78 Z"/><path d="M 64 78 Q 64 48 72 48 Q 80 48 80 78 Z"/></g><line x1="14" y1="86" x2="86" y2="86" stroke="#7f8c8d" stroke-width="2.5"/></svg>', videoQuery:'칼질 손가락 보호 자세'},
{title:'칼 관리·도마 세팅', body:'사용 후에는 즉시 흐르는 물에 씻어 물기를 깨끗이 닦아 보관하고, 일주일에 한 번은 숫돌이나 샤프너로 날을 세웁니다. 도마 아래에는 젖은 행주나 미끄럼방지 패드를 깔아 흔들리지 않도록 고정합니다.', tip:'잘 안 드는 칼이 더 안전할 것 같지만, 무딘 칼은 힘이 헛돌면서 미끄러져 오히려 더 위험합니다.', svg:'<svg viewBox="0 0 100 100"><rect x="12" y="58" width="32" height="11" rx="2" fill="#34495e"/><polygon points="44,59 88,62 88,67 44,70" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="0.8"/><line x1="62" y1="18" x2="62" y2="52" stroke="#7f8c8d" stroke-width="3.5"/><rect x="58" y="50" width="8" height="6" rx="1" fill="#34495e"/><line x1="52" y1="36" x2="56" y2="40" stroke="#f1c40f" stroke-width="2" stroke-linecap="round"/><line x1="68" y1="36" x2="72" y2="40" stroke="#f1c40f" stroke-width="2" stroke-linecap="round"/></svg>', videoQuery:'주방 칼 가는법 숫돌'}
]},
prep: {label: '🧂 재료 손질', items: [
{title:'고기 핏물 빼기', body:'찬물에 30분~1시간 담가 중간에 물을 2~3회 갈아준다. 갈비는 1시간 이상.', tip:'뜨거운 물은 단백질을 굳혀 핏물이 안 빠진다.'},
{title:'누린내·잡내 제거', body:'고기는 청주·맛술 10분, 돼지고기는 생강·후추 추가, 간·내장은 우유 20분.', tip:'생강은 익히기 직전에 넣어야 향이 살아난다.'},
{title:'채소 씻기', body:'잎채소는 흐르는 물에 한 장씩, 시금치는 뿌리에 칼집, 뿌리채소는 솔로 문질러.', tip:'식초물 1분 담그기는 농약·벌레 제거에 효과적.'},
{title:'데치기 시간', body:'끓는 물 + 소금 1작은술. 브로콜리 1분, 시금치 30초, 콩나물·숙주 2~3분 후 즉시 얼음물.', tip:'콩나물은 뚜껑을 처음부터 닫거나 끝까지 열어둘 것.'},
{title:'콩 불리기', body:'병아리콩·검은콩은 8~12시간, 렌틸콩은 불리지 않아도 OK. 부피 3배 물에 냉장.', tip:'여름엔 반드시 냉장 불림, 상온은 쉽게 쉰다.'},
{title:'쌀 불리기', body:'백미는 30분, 현미·잡곡은 2시간 이상. 찬물에 불리고 밥물은 새 물로.', tip:'오래 씻으면 영양소 손실, 가볍게 3~4번이면 충분.'},
{title:'두부 물기 빼기', body:'키친타월로 감싸 무거운 접시로 15~20분 누르거나 전자레인지 2분.', tip:'소금 살짝 뿌리면 물이 더 잘 빠진다.'},
{title:'새우 손질', body:'꼬리 한 마디 남기고 껍질 제거, 등 두 번째 마디에 이쑤시개로 검은 내장을.', tip:'전분·소금으로 비비면 잡내와 점액이 깨끗이 빠진다.'},
{title:'생선 비린내 제거', body:'쌀뜨물·우유·청주 10~15분 담그거나 소금 30분 후 물기 닦기. 레몬즙도 효과적.', tip:'비늘·내장·검은막 제거가 비린내의 90%.'},
{title:'버섯 손질', body:'키친타월·솔로 가볍게 털거나 흐르는 물에 빠르게. 표고는 기둥을 따로 사용.', tip:'물에 담그면 향이 빠지고 식감이 물러진다.'},
{title:'김치 신맛 줄이기', body:'찬물에 5~10분 헹구거나 설탕 한 꼬집 넣고 볶기. 들기름·참기름이 도움.', tip:'신김치는 찌개·볶음용으로 활용하면 더 맛있다.'},
{title:'냉동 고기 해동', body:'냉장실 12~24시간 저온 해동이 가장 안전. 급할 땐 비닐째 찬물 30분~1시간.', tip:'상온·뜨거운 물 해동은 식중독 위험이 크다.'},
{title:'양파 매운맛 빼기', body:'썬 후 찬물에 5~10분 담그거나 식초물에 헹군다. 결대로 썰면 더 부드러워.', tip:'물에 너무 오래 담그면 단맛까지 빠진다.'}
]},
technique: {label: '🔥 조리 기법', items: [
{title:'팬 충분히 예열', body:'중강불 1~2분 달군 뒤 기름. 물 한 방울이 구슬처럼 굴러가면 적정 온도.', tip:'차가운 팬에 재료부터 넣으면 들러붙고 수분이 빠진다.'},
{title:'센·중·약불 구분', body:'센불=볶음·시어링, 중불=일반 조리·소스, 약불=뜸 들이기·은근한 끓임.', tip:'겁나서 약불만 쓰면 물이 생겨 찜이 된다.'},
{title:'시어링 (마이야르)', body:'표면 물기 제거, 한 면이 갈색이 될 때까지 뒤집지 않고 기다린다.', tip:'자꾸 뒤집으면 색도 안 나고 육즙도 빠진다.'},
{title:'볶음 투입 순서', body:'마늘·양파 → 당근·감자 → 버섯·피망 → 잎채소. 시차 두면 식감이 살아난다.', tip:'잎채소를 먼저 넣으면 흐물흐물 죽이 된다.'},
{title:'데쳐서 색 살리기', body:'끓는 소금물 30초~1분 데친 뒤 찬물에 헹구면 색·아삭함 유지, 변색 방지.', tip:'찬물에 식히지 않으면 잔열로 더 익는다.'},
{title:'팬에 너무 많이 넣지 않기', body:'팬 면적의 70% 이하만 채워야 볶아진다. 양 많으면 온도 떨어져 찜이 된다.', tip:'한꺼번에 다 넣지 말고 두 번에 나눠 볶을 것.'},
{title:'양념 투입은 끝물에', body:'간장·설탕·고추장 등 당분·아미노산 양념은 마지막에. 30초~1분만 더 볶기.', tip:'처음부터 간장 부으면 새까맣게 타서 쓴맛 난다.'},
{title:'오븐 예열 필수', body:'표시 온도 도달까지 최소 10~15분 예열. 예열 없이 굽기 시작하면 식감 망친다.', tip:'예열 안 하면 시간만 늘고 결과물 별로.'},
{title:'시트팬 겹치지 않게', body:'재료 사이에 손가락 한 마디 간격. 겹치면 수분 갇혀 찜이 된다.', tip:'종이호일 위에 놓으면 설거지가 줄어든다.'},
{title:'원팬·원팟 액체 비율', body:'재료가 1/3~1/2 잠기는 양. 너무 많으면 묽어지고, 적으면 타거나 안 익는다.', tip:'처음엔 적게, 부족하면 추가하는 편이 안전하다.'},
{title:'면 알덴테 굽기', body:'포장 시간보다 1~2분 짧게. 소스 팬에서 마저 익히면 전분물이 면에 배어든다.', tip:'밀프랩용은 더 짧게, 데울 때를 감안.'},
{title:'쌀밥 비율과 뜸', body:'백미 1 : 물 1.1~1.2, 30분 불림 → 강불 끓이고 약불 12분 → 끄고 10분 뜸.', tip:'다 됐다고 바로 뚜껑 열면 진밥·된밥 갈린다.'},
{title:'고기 휴지(rest)', body:'스테이크·닭가슴살은 익힌 뒤 5~10분 도마에서 휴지. 육즙이 재흡수된다.', tip:'바로 자르면 도마가 육즙 바다가 된다.'},
{title:'소스 농도는 전분물', body:'전분 1 : 물 2 비율. 끓는 소스에 조금씩 흘려넣고 저으며, 1분 더 끓여 풋내 날리기.', tip:'차가운 물에 풀어야 덩어리지지 않는다.'}
]},
sauce: {label: '🥣 양념·소스', items: [
{title:'한식 만능 양념장', body:'간장 3 : 설탕 1 : 다진마늘 1 : 참기름 1 : 다진파 2. 무침·조림·볶음 만능.', tip:'설탕 대신 매실청 1을 쓰면 감칠맛이 살아남.'},
{title:'불고기 양념', body:'간장 4 : 설탕 2 : 배즙 3 : 다진마늘 1 : 참기름 1 + 후추. 30분~2시간 재우기.', tip:'키위·파인애플 과량 시 고기가 뭉개진다.'},
{title:'제육볶음 양념', body:'고추장 3 : 고춧가루 1 : 간장 1 : 설탕 1 : 다진마늘 1 : 생강 0.5 : 청주 1.', tip:'양파를 함께 재우면 단맛과 육질이 살아남.'},
{title:'데리야끼 소스', body:'간장 2 : 미림 2 : 설탕 1 : 청주 1. 약불에서 1/3까지 졸이면 윤기 나는 소스.', tip:'전분물 추가는 NO, 졸여서 점도 내기.'},
{title:'토마토 소스 베이스', body:'홀토마토 4 : 양파 1 : 마늘 0.5 : 올리브유 1 + 소금·설탕. 20분 졸임.', tip:'설탕 한 꼬집이 산미를 부드럽게 만든다.'},
{title:'고추장 비빔 양념', body:'고추장 2 : 설탕 1 : 식초 1 : 참기름 1 : 다진마늘 0.5 : 통깨 0.5.', tip:'사이다 0.5 추가 시 청량한 단맛이 살아남.'},
{title:'미소·된장 양념', body:'된장 2 : 미림 1 : 설탕 0.5 : 다진마늘 0.5 : 참기름 0.5. 가지·연어 구이에.', tip:'오래 끓이면 향이 날아감, 마지막에 투입.'},
{title:'굴소스 볶음 베이스', body:'굴소스 2 : 간장 1 : 설탕 0.5 : 청주 1 : 다진마늘 1 + 후추. 중식풍 만능.', tip:'굴소스 자체가 짜므로 소금 추가 금지.'},
{title:'스리라차 마요', body:'마요 3 : 스리라차 1 : 라임즙 0.5 : 꿀 0.5. 포케·새우튀김·샌드위치에.', tip:'꿀 대신 연유 쓰면 더 진한 풍미.'},

function findTipsForText(text){
if(!text) return [];
const matched = new Set();
const result = [];
Object.entries(COOKING_TIPS).forEach(([catKey, cat]) => {
cat.items.forEach(tip => {
if(matched.has(tip.title)) return;
const keywords = TIP_KEYWORDS[tip.title];
if(!keywords || keywords.length === 0) return;
const hit = keywords.some(k => {
if(k.includes('.*')){
try{ return new RegExp(k).test(text); }catch(e){ return false; }
}
return text.includes(k);
});
if(hit){
matched.add(tip.title);
result.push({...tip, catKey, catLabel: cat.label});
}
});
});
return result;
}

function classifyCookingPhase(recipe){
const name = recipe.name || '';
const cookTime = recipe.cookTime || 0;
const type = recipe.type;
const ingText = (recipe.ingredients || []).join(' ');
if(/회 |포케|샐러드/.test(name) || /연어회|참치회|광어회/.test(ingText)) return 4;
if(cookTime >= 45 || /찜|스튜|개장|곰탕|전골|육수/.test(name)) return 1;
if(type === 'sheet-pan' || cookTime >= 25) return 2;
return 3;
}

desc:'<b>준비물</b>: 큰 볼, 찬물, 키친타월.<br><b>방법</b>: 볼에 찬물을 가득 채우고 고기가 완전히 잠기도록 담근 뒤 냉장에서 30분마다 한 번씩 물을 갈아 줍니다. 갈비는 1시간 이상, 국거리·사태는 30분이면 충분합니다. 핏물을 뺀 뒤 끓는 물에 1~2분 데쳐 거품과 불순물을 걷어내면 잡내가 거의 없어집니다. 마지막에 키친타월로 표면 물기를 꼼꼼히 닦아야 시어링 시 노릇한 색이 잘 납니다.',
match:r => /갈비|국거리|소고기 양지|소고기 사태|찜용/.test((r.ingredients||[]).join(' '))},
{title:'단단한 채소 미리 손질 (밀폐용기 냉장)',
desc:'<b>준비물</b>: 채소칼·필러, 도마, 밀폐용기 3~4개, 키친타월.<br><b>방법</b>: 양파·당근·감자·고구마는 미리 씻어 껍질을 벗기고 각 레시피의 모양(깍둑·채·반달)에 맞춰 썰어 밀폐용기에 담습니다. 감자·고구마는 갈변되지 않도록 찬물에 잠기게 두었다가 사용 직전에 물기를 빼고, 양파는 매운 향이 다른 채소로 옮지 않게 따로 담는 것이 좋습니다. 잎채소는 손질 후 키친타월을 깐 용기에 보관해야 물기 없이 신선합니다.',
match:r => /당근|감자|고구마|양파|애호박|주키니|단호박/.test((r.ingredients||[]).join(' '))},
{title:'곡물·콩 미리 불리기',
desc:'<b>준비물</b>: 큰 볼·체, 부피 3배 정도의 찬물.<br><b>방법</b>: 곡물은 손바닥으로 가볍게 3~4번 비벼 씻어 흐린 물을 버린 뒤 부피의 약 3배 되는 찬물에 담급니다. 백미는 30분, 현미·잡곡은 2시간 이상, 병아리콩·검은콩은 8~12시간(하룻밤) 불려야 부드럽게 익습니다. 여름철에는 상온에서 쉽게 쉬므로 반드시 냉장에서 불리고, 사용 직전에 체에 받쳐 물기를 뺍니다.',
match:r => /현미|백미|쌀 |쌀$|퀴노아|오트밀|보리|렌틸콩|병아리콩|검은콩|오르조/.test((r.ingredients||[]).join(' '))},
{title:'밀프랩 용기·라벨 준비',
desc:'<b>준비물</b>: 유리·BPA-free 플라스틱 용기 (1회분 사이즈), 마스킹테이프 또는 라벨지, 네임펜.<br><b>방법</b>: 용기를 세척해 물기를 완전히 말린 뒤, 라벨에 메뉴명·조리일·소비기한을 적어 붙입니다. 냉동 보관분에는 해동 권장일까지 함께 표기하면 좋습니다. 국·찌개는 깊은 용기에, 마른 반찬·구이는 평평한 용기에 담아야 식감이 흐트러지지 않습니다. 샐러드는 드레싱을 작은 용기에 따로 담아 먹기 직전에 뿌리는 편이 신선합니다.',
match:() => true, universal:true}
];
const taskItems = prepTasks.map(t => {
const hits = recipes.filter(t.match);
if(hits.length === 0) return '';
let recipeStr;
if(t.universal){
recipeStr = `→ 이번 주 전체 ${recipes.length}개 요리`;
} else {
const names = hits.slice(0, 3).map(r => r.name).join(', ');
const more = hits.length > 3 ? ` 외 ${hits.length - 3}개` : '';
recipeStr = `→ ${names}${more}`;
}
return `<li><strong>${t.title}</strong><div class="prep-desc">${t.desc}</div><div class="prep-recipes">${recipeStr}</div></li>`;
}).filter(Boolean).join('');
let html = `<div class="cook-tip"><strong>💡 D-1 (조리 전날) 밑준비 체크리스트</strong><ul class="prep-list">${taskItems}</ul></div>`;
const activePhases = phases.map(p => ({...p, items: recipes.filter(r => r._phase === p.n).sort((a,b) => (b.cookTime||0) - (a.cookTime||0))}))
.filter(p => p.items.length > 0);
activePhases.forEach((phase, idx) => {
const displayN = idx + 1;
html += `<div class="cook-phase" data-phase="${phase.n}">
<div class="cook-phase-header"><h3>${phase.icon} ${displayN}단계 — ${phase.label}</h3><p>${phase.desc}</p></div>
<div class="cook-phase-items">${phase.items.map(r => `
<div class="cook-item" data-cat="${r.displayCategory||''}" onclick="openModal('${r.name.replace(/'/g,"\\'")}')">
<div class="cook-item-name">${r.name}</div>
<div class="cook-item-meta">⏱ ${r.cookTime}분 · ${r.servings||4}인분 · ${r._slots.join(', ')}</div>
</div>`).join('')}</div>
</div>`;
});
const totalMin = recipes.reduce((s, r) => s + (r.cookTime || 0), 0);
const totalH = Math.floor(totalMin / 60);
const remM = totalMin % 60;
html += `<div class="cook-summary">📊 단순 합산 조리 시간: <strong>약 ${totalH>0?totalH+'시간 ':''}${remM}분</strong> · 1·2단계를 병렬로 진행하면 실제 소요 시간은 절반 가량으로 단축됩니다.</div>`;
document.getElementById('cookingOrderSection').innerHTML = html;
}

ripple.classList.add('ripple');

    window.addEventListener('scroll',()=>{

// Cursor Trail
