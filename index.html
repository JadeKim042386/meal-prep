  let lastTrail=0;
  document.addEventListener('mousemove',e=>{
    const now=Date.now();
    if(now-lastTrail<30)return;
    lastTrail=now;
    const dot=document.createElement('div');
    dot.className='cursor-trail';
    dot.style.left=e.clientX+'px';
    dot.style.top=e.clientY+'px';
    document.body.appendChild(dot);
    setTimeout(()=>dot.remove(),600);
  });
}

// 3D Tilt Cards
if(!('ontouchstart' in window)){
  document.addEventListener('mousemove',e=>{
    const card=e.target.closest('.recipe-card');
    if(!card)return;
    const rect=card.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;
    const rotateX=(y-rect.height/2)/12;
    const rotateY=(rect.width/2-x)/12;
    card.style.transform=`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-6px) scale(1.02)`;
  });
  document.addEventListener('mouseover',e=>{
    const card=e.target.closest('.recipe-card');
    if(!card||card._tiltBound)return;
    card._tiltBound=true;
    card.addEventListener('mouseleave',()=>{card.style.transform='';card._tiltBound=false;});
  });
}

// Text Scramble
function scrambleText(el){
  const original=[...el.textContent];
  const chars='가나다라마바사아자차카타파하밀프랩요리식단';
  let iteration=0;
  const interval=setInterval(()=>{
    el.textContent=original.map((c,i)=>{
      if(c===' ')return ' ';
      if(i<iteration)return original[i];
      return chars[Math.floor(Math.random()*chars.length)];
    }).join('');
    if(iteration>=original.length)clearInterval(interval);
    iteration+=0.5;
  },40);
}
setTimeout(()=>scrambleText(document.querySelector('.header h1')),300);

// Magnetic Button
const magneticBtn=document.getElementById('regenerateBtn');
if(magneticBtn&&!('ontouchstart' in window)){
  magneticBtn.addEventListener('mousemove',e=>{
    magneticBtn.style.transition='none';
    const rect=magneticBtn.getBoundingClientRect();
    const x=e.clientX-rect.left-rect.width/2;
    const y=e.clientY-rect.top-rect.height/2;
    magneticBtn.style.transform=`translate(${x*0.3}px,${y*0.3}px)`;
  });
  magneticBtn.addEventListener('mouseleave',()=>{
    magneticBtn.style.transition='transform 0.4s ease';
    magneticBtn.style.transform='';
    setTimeout(()=>magneticBtn.style.transition='',400);
  });
}

// Confetti
function launchConfetti(){
  const colors=['#E74C3C','#F39C12','#2ECC71','#3498DB','#9B59B6'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'%';
    c.style.background=colors[Math.floor(Math.random()*5)];
    c.style.animationDelay=Math.random()*0.5+'s';
    c.style.animationDuration=(1.5+Math.random()*2)+'s';
    c.style.width=(6+Math.random()*8)+'px';
    c.style.height=(6+Math.random()*8)+'px';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4500);
  }
}

<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>

<div class="feedback-overlay" id="feedbackOverlay" onclick="if(event.target===this)this.classList.remove('active')">
<div class="feedback-modal">
<h3>피드백 보내기</h3>
<p>개선 사항이나 의견을 남겨주세요. 익명으로 전송됩니다.</p>
<textarea id="feedbackBody" placeholder="피드백 내용을 입력해주세요..." maxlength="2000" oninput="document.getElementById('charCount').textContent=this.value.length+'/2000'"></textarea>
<div class="char-count" id="charCount">0/2000</div>
<div class="turnstile-wrap" id="turnstileWrap"></div>
<div class="feedback-actions">
<button class="btn-cancel" onclick="closeFeedback()">취소</button>
<button class="btn-submit" id="feedbackSubmit" onclick="submitFeedback()">보내기</button>
</div>
<div class="feedback-status" id="feedbackStatus"></div>
</div>
</div>

<script>
let turnstileWidgetId;
function renderTurnstile(){
  if(typeof turnstile!=='undefined'&&!turnstileWidgetId){
    turnstileWidgetId=turnstile.render('#turnstileWrap',{sitekey:'0x4AAAAAADBIvWafxWnKEs21',theme:'light',size:'flexible'});
  }
}
const tObs=new MutationObserver(()=>{if(typeof turnstile!=='undefined'){renderTurnstile();tObs.disconnect()}});
tObs.observe(document.head,{childList:true,subtree:true});
setTimeout(()=>{renderTurnstile()},2000);

async function submitFeedback(){
  const body=document.getElementById('feedbackBody').value.trim();
  const status=document.getElementById('feedbackStatus');
  const btn=document.getElementById('feedbackSubmit');
  status.className='feedback-status';status.style.display='none';
  if(!body){status.textContent='내용을 입력해주세요';status.className='feedback-status error';status.style.display='block';return}
  const token=turnstile.getResponse(turnstileWidgetId);
  if(!token){status.textContent='인증 체크박스를 완료해주세요';status.className='feedback-status error';status.style.display='block';return}
  btn.disabled=true;btn.textContent='전송 중...';
  try{
    const res=await fetch('https://vpcozjkbossofcnarspv.supabase.co/functions/v1/create-issue',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({body,turnstile_token:token})
    });
    const data=await res.json();
    if(res.ok){
      status.textContent='피드백이 전송되었습니다. 감사합니다!';status.className='feedback-status success';status.style.display='block';
      document.getElementById('feedbackBody').value='';document.getElementById('charCount').textContent='0/2000';
      turnstile.reset(turnstileWidgetId);
      setTimeout(()=>closeFeedback(),2000);
    }else{
      status.textContent=data.error||'전송에 실패했습니다';status.className='feedback-status error';status.style.display='block';
      turnstile.reset(turnstileWidgetId);
    }
  }catch(e){
    status.textContent='네트워크 오류가 발생했습니다';status.className='feedback-status error';status.style.display='block';
  }finally{btn.disabled=false;btn.textContent='보내기'}
}
function closeFeedback(){
  document.getElementById('feedbackOverlay').classList.remove('active');
  document.getElementById('feedbackStatus').style.display='none';
}
