const VOLUME_UNITS = new Set(['g','kg','ml','L','컵','큰술','작은술']);

function appendWeight(itemName, amount){
if(!amount || !itemName) return amount;
const m = amount.match(/^(\d+(?:\.\d+)?(?:\/\d+)?)\s*(.*)$/);
if(!m) return amount;
const numStr = m[1];
let unit = m[2].trim();
const trailing = unit.match(/\s*\([^)]*\)\s*$/);
const trailingText = trailing ? trailing[0] : '';
unit = unit.replace(/\s*\([^)]*\)\s*/g, '').trim().replace(/\s*[+&].*$/, '').trim();
if(VOLUME_UNITS.has(unit)) return amount;
const stripped = itemName.replace(/\s*\([^)]*\)\s*/g, '').trim();
const hint = WEIGHT_HINTS[itemName] || WEIGHT_HINTS[stripped];
if(!hint || !(unit in hint)) return amount;
let num;
if(numStr.includes('/')){
const [a,b] = numStr.split('/').map(Number);
num = a/b;
} else {
num = parseFloat(numStr);
}
if(isNaN(num)) return amount;
const totalG = Math.round(num * hint[unit]);
const display = (Number.isInteger(num) ? num : (Math.round(num*100)/100)) + unit;
return display + trailingText + ' (약 ' + totalG + 'g)';
}

let currentCat = 'all';
let searchQuery = '';

// Recipes
// 같은 메뉴명의 모든 변형(레시피)을 반환
function getMenuVariants(name){
return DATA.recipes.filter(r => r.name === name);
}

function renderRecipes(){
const grid = document.getElementById('recipeGrid');
let recipes = DATA.recipes.filter(r => !isSideDish(r));
if(currentCat !== 'all') recipes = recipes.filter(r => r.displayCategory === currentCat);
if(searchQuery){
const q = searchQuery.toLowerCase();
recipes = recipes.filter(r => r.name.toLowerCase().includes(q) || r.ingredients.some(i => i.toLowerCase().includes(q)) || (r.tags && r.tags.some(t => t.toLowerCase().includes(q))));
}
// 같은 메뉴명은 1개 카드로 묶고 변형 개수 표시
const seen = {};
const grouped = [];
for(const r of recipes){
if(!seen[r.name]){ seen[r.name] = {recipe: r, count: 1}; grouped.push(seen[r.name]); }
else seen[r.name].count++;
}
grid.innerHTML = grouped.map((g,i) => {
const r = g.recipe;
const catClass = CAT_COLORS[r.displayCategory] || 'korean';
const catName = CAT_NAMES[r.displayCategory] || r.displayCategory;
const typeName = TYPE_NAMES[r.type] || r.type;
const variantBadge = g.count > 1 ? `<span class="variant-indicator">${g.count}가지 레시피</span>` : '';
return `<div class="recipe-card" data-cat="${r.displayCategory}" onclick="openModal('${r.name.replace(/'/g,"\\'")}')">
${variantBadge}
<div class="badges"><span class="badge badge-${catClass}">${catName}</span><span class="badge badge-type">${typeName}</span></div>
<h3>${r.name}</h3>
<div class="recipe-meta">
<span>\u23f1\ufe0f ${r.cookTime}\ubd84</span>
<span>${r.difficulty}</span>
<span>\ud83d\udd25 ${r.calories}kcal</span>
<span>\ud83d\udcaa ${r.protein}g</span>
</div>
<div style="font-size:0.8em;color:var(--text-light);margin-top:6px">${r.servings}\uc778\ubd84</div>
</div>`;
}).join('');
if(grouped.length === 0) grid.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-light)">\uac80\uc0c9 \uacb0\uacfc\uac00 \uc5c6\uc2b5\ub2c8\ub2e4.</p>';
}

function observeCards(){
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry,i) => {
      if(entry.isIntersecting){
        setTimeout(()=>entry.target.classList.add('visible'), i*50);
        observer.unobserve(entry.target);
      }
    });
  },{threshold:0.1});
  document.querySelectorAll('.recipe-card').forEach(c=>observer.observe(c));
}

// Modal — 변형(variant)이 여러 개일 경우 페이지네이션 지원
let modalState = { name: null, index: 0, variants: [] };

function openModal(name){
const variants = getMenuVariants(name);
if(variants.length === 0) return;
modalState = { name, index: 0, variants };
renderModal();
document.getElementById('modalOverlay').classList.add('active');
document.body.style.overflow = 'hidden';
}

function showVariant(delta){
const n = modalState.variants.length;
if(n <= 1) return;
modalState.index = (modalState.index + delta + n) % n;
renderModal();
const modalEl = document.getElementById('modal');
if(modalEl) modalEl.scrollTop = 0;
}

const r = modalState.variants[modalState.index];

function isSideDish(r){
// 반찬/밑반찬: 메인 식사로 부적합한 레시피 제외
const exclude = ['시금치나물','멸치볶음','어묵볶음','계란장조림','두부조림','닭가슴살 볶음고추장'];
if(exclude.includes(r.name)) return true;
// 칼로리 250 미만 + 반찬/밑반찬/나물 태그
const tags = (r.tags||[]).map(t=>t.toLowerCase());
const sideTags = ['반찬','밑반찬','나물'];
if(r.calories <= 250 && tags.some(t => sideTags.includes(t))) return true;
// 국/찌개 단독은 한 끼로 부족 (칼로리 200 이하)
if(r.calories <= 200) return true;
return false;
}

// 레시피 → 정규화된 재료명 Set
function recipeIngredientSet(recipe){
const set = new Set();
for(const ing of recipe.ingredients){
const m = ing.match(/^(.+?)\s+\d/);
const itemName = m ? m[1].trim() : ing.trim();
const stripped = itemName.replace(/\s*\([^)]*\)\s*/g, '').trim();
const canonical = (typeof SHOP_ALIASES !== 'undefined' && (SHOP_ALIASES[itemName] || SHOP_ALIASES[stripped])) || stripped || itemName;
if(canonical) set.add(canonical);
}
return set;
}

// Jaccard 유사도
function jaccardSim(a, b){
let inter = 0;
a.forEach(x => { if(b.has(x)) inter++; });
const uni = a.size + b.size - inter;
return uni === 0 ? 0 : inter / uni;
}

// 응집형 계층 클러스터링: 재료 Jaccard 유사도가 높은 쌍을 반복 병합
function computeRecipeClusters(pool, targetK){
const sets = pool.map(r => ({recipe: r, ings: recipeIngredientSet(r)}));
let clusters = sets.map(s => ({items: [s], ings: new Set(s.ings)}));
const k = Math.min(targetK, clusters.length);
while(clusters.length > k){
let bi = 0, bj = 1, bs = -1;
for(let i = 0; i < clusters.length; i++){
for(let j = i+1; j < clusters.length; j++){
const sim = jaccardSim(clusters[i].ings, clusters[j].ings);
if(sim > bs){ bs = sim; bi = i; bj = j; }
}
}
const merged = {
items: [...clusters[bi].items, ...clusters[bj].items],
ings: new Set([...clusters[bi].ings, ...clusters[bj].ings])
};
clusters.splice(bj, 1);
clusters.splice(bi, 1);
clusters.push(merged);
}
return clusters;
}

// 클러스터 테마 라벨링: 카테고리 + 단백질 + 조리 스타일
function labelClusterTheme(cluster){
const recipes = cluster.items.map(s => s.recipe);
const half = Math.ceil(recipes.length / 2);
// 1) 카테고리
const catCount = {};
recipes.forEach(r => { const c = r.displayCategory || 'korean'; catCount[c] = (catCount[c]||0) + 1; });
const dominant = Object.entries(catCount).sort((a,b) => b[1]-a[1])[0];
const catLabel = (typeof CAT_NAMES !== 'undefined' ? CAT_NAMES[dominant[0]] : dominant[0]) || dominant[0];
// 2) 단백질 키워드
const proteins = ['닭가슴살','닭다리살','삼겹살','대패삼겹','소고기','돼지고기','연어','새우','오징어','참치','두부','계란','햄','베이컨','만두','꽁치'];
const pCount = {};
recipes.forEach(r => {
const text = r.ingredients.join(' ');
proteins.forEach(p => { if(text.includes(p)) pCount[p] = (pCount[p]||0) + 1; });
});
const topProteins = Object.entries(pCount)
.sort((a,b) => b[1]-a[1])
.filter(([_,c]) => c >= half)
.slice(0,2)
.map(([p]) => p);
// 3) 스타일
const styleChecks = [
['덮밥', r => r.name.includes('덮밥')],
['시트팬', r => r.type === 'sheet-pan' || r.name.includes('시트팬')],
['찌개·국물', r => /찌개|탕|국밥|개장|짜글이/.test(r.name)],
['찜', r => /찜/.test(r.name)],
['면', r => /파스타|국수|우동|랩|쫄면|짜장|짬뽕/.test(r.name)],
['볶음밥', r => r.name.includes('볶음밥')],
['비빔밥·볼', r => /비빔밥|볼\s*$|볼\s*\(/.test(r.name)],
['샐러드', r => r.name.includes('샐러드')]
];
const sCount = {};
recipes.forEach(r => {
styleChecks.forEach(([s, f]) => { if(f(r)) sCount[s] = (sCount[s]||0) + 1; });
});
const topStyles = Object.entries(sCount)
.sort((a,b) => b[1]-a[1])
.filter(([_,c]) => c >= half)
.slice(0,2)
.map(([s]) => s);
// 조립
const parts = [catLabel];
if(topProteins.length) parts.push(topProteins.join('·'));
if(topStyles.length) parts.push(topStyles.join('·'));
return parts.join(' ');
}

function generateWeeklyPlan(mode){
const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
const meals = ['lunch','dinner'];
// 메뉴명 기준 dedup: 같은 이름의 변형은 한 번만 풀에 포함
const dedupByName = arr => {
const seen = new Set();
return arr.filter(r => { if(seen.has(r.name)) return false; seen.add(r.name); return true; });
};
let pool = dedupByName(DATA.recipes.filter(r => !isSideDish(r)));

if(mode === 'korean') pool = pool.filter(r => r.displayCategory === 'korean' || r.category === 'korean');
if(mode === 'highprotein') pool = pool.filter(r => r.protein >= 30);
if(mode === 'quick') pool = pool.filter(r => r.cookTime <= 20);

if(pool.length < 7) pool = dedupByName(DATA.recipes.filter(r => !isSideDish(r)));

const plan = {};

if(mode === 'quick'){
// 초간편: 재료 유사도 기반 응집형 계층 클러스터링으로 묶음 추출
// 임의 클러스터를 골라 14끼에 분배 → 장보기 리스트 최소화 + 테마 라벨 표시
const clusters = computeRecipeClusters(pool, 12);
// 3개 미만 클러스터(고립 outlier)는 제외, 부족하면 2개 이상 허용
let usable = clusters.filter(c => c.items.length >= 3);
if(usable.length === 0) usable = clusters.filter(c => c.items.length >= 2);
if(usable.length === 0) usable = clusters;
const chosen = usable[Math.floor(Math.random() * usable.length)];
// 클러스터 내부 무작위 셔플 후 7개 선택 (매번 다른 7개)
const shuffledItems = [...chosen.items].sort(() => Math.random() - 0.5);
const picks = shuffledItems.slice(0, Math.min(7, shuffledItems.length));
const pickNames = picks.map(p => p.recipe.name);
let idx = 0;
days.forEach(day => {
plan[day] = {
lunch: pickNames[idx % pickNames.length],
dinner: pickNames[(idx+1) % pickNames.length]
};
idx += 2;
});
plan._theme = labelClusterTheme(chosen);
} else {
// 일반: 14끼 비중복, 카테고리 분산
const shuffled = [...pool].sort(() => Math.random() - 0.5);
const used = new Set();
days.forEach(day => {
plan[day] = {};
meals.forEach(meal => {
const pick = shuffled.find(r => !used.has(r.name));
if(pick){ plan[day][meal] = pick.name; used.add(pick.name); }
});
});
}
return plan;
}

function parseAmount(amtStr){
if(!amtStr || amtStr === '적당량') return null;
const m = amtStr.match(/^(\d+(?:\.\d+)?(?:\/\d+)?)\s*(.*)$/);
if(!m) return null;
let numStr = m[1];
let unit = m[2].trim();
unit = unit.replace(/\s*\([^)]*\)\s*/g, '').trim();
unit = unit.replace(/\s*[+&].*$/, '').trim();
let num;
if(numStr.includes('/')){
const [a,b] = numStr.split('/').map(Number);
num = a/b;
} else {
num = parseFloat(numStr);
}
if(isNaN(num)) return null;
return {num, unit};
}

function sumAmounts(amounts, itemName){
const byUnit = {};
const order = [];
let freeformCount = 0;
amounts.forEach(a => {
const parsed = parseAmount(a);
if(!parsed){ freeformCount++; return; }
if(!(parsed.unit in byUnit)){ byUnit[parsed.unit] = 0; order.push(parsed.unit); }
byUnit[parsed.unit] += parsed.num;
});
const parts = order.map(u => {
const n = byUnit[u];
const display = Number.isInteger(n) ? n : Math.round(n*10)/10;
const part = display + (u ? u : '');
return itemName ? appendWeight(itemName, part) : part;
});
if(freeformCount > 0) parts.push('적당량');
return parts.length ? parts.join(' + ') : '적당량';
}

// 재료 분량 스케일: 원본 amount × scale (배치 수, 정수)
// 예) 레시피 3인분, 식단표 2회 등장 → ceil(2/3)=1배치 → 양 그대로
// 예) 레시피 3인분, 식단표 4회 등장 → ceil(4/3)=2배치 → 양 ×2
function scaleAmount(amtStr, scale){
if(!amtStr || amtStr === '적당량' || Math.abs(scale - 1) < 0.001) return amtStr;
const m = amtStr.match(/^(\d+(?:\.\d+)?(?:\/\d+)?)(.*)$/);
if(!m) return amtStr;
const numStr = m[1];
const rest = m[2];
let num;
if(numStr.includes('/')){
const [a,b] = numStr.split('/').map(Number);
num = a/b;
} else {
num = parseFloat(numStr);
}
if(isNaN(num)) return amtStr;
const scaled = num * scale;
if(scaled < 0.05) return '약간';
const display = Number.isInteger(scaled) ? scaled : Math.round(scaled*100)/100;
return display + rest;
}

function generateShoppingList(){

Object.entries(occurrences).forEach(([recipeName, count]) => {

// (필요 인분 ≤ 배치 인분 → 1배치, 잉여는 다음 끼/도시락으로 활용)
const scale = Math.ceil(count / servings);
recipe.ingredients.forEach(ing => {
const cat = classifyIngredient(ing);
const match = ing.match(/^(.+?)\s+(\d[\d\/\.]*\s*.+)$/);
let itemName = ing;
let amount = '';
if(match){
itemName = match[1].trim();
amount = scaleAmount(match[2].trim(), scale);
}
const stripped = itemName.replace(/\s*\([^)]*\)\s*/g, '').trim();
const canonical = SHOP_ALIASES[itemName] || SHOP_ALIASES[stripped] || stripped || itemName;
if(seen[cat][canonical]){
seen[cat][canonical].amounts.push(amount || '적당량');
} else {
seen[cat][canonical] = {item: canonical, amounts: [amount || '적당량']};
}
});
});

const result = {};
Object.keys(categorized).forEach(cat => {
result[cat] = Object.values(seen[cat]).map(entry => ({
item: entry.item,
amount: sumAmounts(entry.amounts, entry.item)
}));
});
return result;
}

function renderShopping(){
const cats = ['meat','vegetable','dairy','grain','sauce','etc'];
const shoppingData = generateShoppingList();
// 식단표 끼니 수 계산 (안내 문구용)
const activePlan = getActiveWeeklyPlan();
const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
let mealCount = 0;
days.forEach(day => {
const plan = activePlan[day];
if(!plan) return;
['lunch','dinner'].forEach(meal => { if(plan[meal]) mealCount++; });
});
let html = `<div class="shop-info">📋 이번 주 <strong>${mealCount}끼</strong> 분 <strong>최소 구매량</strong>입니다 — 각 레시피를 한 배치(인분 단위)로 만들 수 있도록 올림 환산했어요. <span class="shop-info-sub">레시피 인분이 끼니 수보다 많으면 <strong>잉여 분량은 다음 식사·도시락으로 활용</strong>하세요.</span></div>`;
cats.forEach(cat => {
const items = shoppingData[cat] || [];
if(items.length === 0) return;
html += `<div class="shopping-category">
<div class="shopping-header" onclick="toggleShop(this)">
<span>${SHOP_ICONS[cat]} ${SHOP_NAMES[cat]} (${items.length})</span>
<span class="arrow">▼</span>
</div>
<div class="shopping-items">${items.map((it,i) => {
const subs = findSubstitutes(it.item);
const subHtml = subs ? `<div class="shop-sub">↪ 대체 가능: ${subs.join(', ')}</div>` : '';
return `<div class="shopping-item" id="shop-${cat}-${i}">
<div class="shop-row">
<input type="checkbox" id="cb-${cat}-${i}" onchange="toggleCheck(this)">
<label for="cb-${cat}-${i}">${it.item}</label>
<span class="amount">${it.amount}</span>
</div>
${subHtml}
</div>`;
}).join('')}</div>
</div>`;
});
document.getElementById('shoppingSection').innerHTML = html;
}

{title:'버섯 손질', body:'키친타월·솔로 가볍게 털거나 흐르는 물에 빠르게. 표고는 기둥을 따로 사용.', tip:'물에 담그면 향이 빠지고 식감이 물러진다.'},
{title:'김치 신맛 줄이기', body:'찬물에 5~10분 헹구거나 설탕 한 꼬집 넣고 볶기. 들기름·참기름이 도움.', tip:'신김치는 찌개·볶음용으로 활용하면 더 맛있다.'},
{title:'냉동 고기 해동', body:'냉장실 12~24시간 저온 해동이 가장 안전. 급할 땐 비닐째 찬물 30분~1시간.', tip:'상온·뜨거운 물 해동은 식중독 위험이 크다.'},
{title:'양파 매운맛 빼기', body:'썬 후 찬물에 5~10분 담그거나 식초물에 헹군다. 결대로 썰면 더 부드러워.', tip:'물에 너무 오래 담그면 단맛까지 빠진다.'}
]},
technique: {label: '🔥 조리 기법', items: [
{title:'팬 충분히 예열', body:'중강불 1~2분 달군 뒤 기름. 물 한 방울이 구슬처럼 굴러가면 적정 온도.', tip:'차가운 팬에 재료부터 넣으면 들러붙고 수분이 빠진다.'},
{title:'센·중·약불 구분', body:'센불=볶음·시어링, 중불=일반 조리·소스, 약불=뜸 들이기·은근한 끓임.', tip:'겁나서 약불만 쓰면 물이 생겨 찜이 된다.'},
{title:'시어링 (마이야르)', body:'표면 물기 제거, 한 면이 갈색이 될 때까지 뒤집지 않고 기다린다.', tip:'자꾸 뒤집으면 색도 안 나고 육즙도 빠진다.'},
{title:'볶음 투입 순서', body:'마늘·양파 → 당근·감자 → 버섯·피망 → 잎채소. 시차 두면 식감이 살아난다.', tip:'잎채소를 먼저 넣으면 흐물흐물 죽이 된다.'},
{title:'데쳐서 색 살리기', body:'끓는 소금물 30초~1분 데친 뒤 찬물에 헹구면 색·아삭함 유지, 변색 방지.', tip:'찬물에 식히지 않으면 잔열로 더 익는다.'},
{title:'팬에 너무 많이 넣지 않기', body:'팬 면적의 70% 이하만 채워야 볶아진다. 양 많으면 온도 떨어져 찜이 된다.', tip:'한꺼번에 다 넣지 말고 두 번에 나눠 볶을 것.'},
{title:'양념 투입은 끝물에', body:'간장·설탕·고추장 등 당분·아미노산 양념은 마지막에. 30초~1분만 더 볶기.', tip:'처음부터 간장 부으면 새까맣게 타서 쓴맛 난다.'},
{title:'오븐 예열 필수', body:'표시 온도 도달까지 최소 10~15분 예열. 예열 없이 굽기 시작하면 식감 망친다.', tip:'예열 안 하면 시간만 늘고 결과물 별로.'},
{title:'시트팬 겹치지 않게', body:'재료 사이에 손가락 한 마디 간격. 겹치면 수분 갇혀 찜이 된다.', tip:'종이호일 위에 놓으면 설거지가 줄어든다.'},
{title:'원팬·원팟 액체 비율', body:'재료가 1/3~1/2 잠기는 양. 너무 많으면 묽어지고, 적으면 타거나 안 익는다.', tip:'처음엔 적게, 부족하면 추가하는 편이 안전하다.'},
{title:'면 알덴테 굽기', body:'포장 시간보다 1~2분 짧게. 소스 팬에서 마저 익히면 전분물이 면에 배어든다.', tip:'밀프랩용은 더 짧게, 데울 때를 감안.'},
{title:'쌀밥 비율과 뜸', body:'백미 1 : 물 1.1~1.2, 30분 불림 → 강불 끓이고 약불 12분 → 끄고 10분 뜸.', tip:'다 됐다고 바로 뚜껑 열면 진밥·된밥 갈린다.'},
{title:'고기 휴지(rest)', body:'스테이크·닭가슴살은 익힌 뒤 5~10분 도마에서 휴지. 육즙이 재흡수된다.', tip:'바로 자르면 도마가 육즙 바다가 된다.'},
{title:'소스 농도는 전분물', body:'전분 1 : 물 2 비율. 끓는 소스에 조금씩 흘려넣고 저으며, 1분 더 끓여 풋내 날리기.', tip:'차가운 물에 풀어야 덩어리지지 않는다.'}
]},
sauce: {label: '🥣 양념·소스', items: [
{title:'한식 만능 양념장', body:'간장 3 : 설탕 1 : 다진마늘 1 : 참기름 1 : 다진파 2. 무침·조림·볶음 만능.', tip:'설탕 대신 매실청 1을 쓰면 감칠맛이 살아남.'},
{title:'불고기 양념', body:'간장 4 : 설탕 2 : 배즙 3 : 다진마늘 1 : 참기름 1 + 후추. 30분~2시간 재우기.', tip:'키위·파인애플 과량 시 고기가 뭉개진다.'},
{title:'제육볶음 양념', body:'고추장 3 : 고춧가루 1 : 간장 1 : 설탕 1 : 다진마늘 1 : 생강 0.5 : 청주 1.', tip:'양파를 함께 재우면 단맛과 육질이 살아남.'},
{title:'데리야끼 소스', body:'간장 2 : 미림 2 : 설탕 1 : 청주 1. 약불에서 1/3까지 졸이면 윤기 나는 소스.', tip:'전분물 추가는 NO, 졸여서 점도 내기.'},
{title:'토마토 소스 베이스', body:'홀토마토 4 : 양파 1 : 마늘 0.5 : 올리브유 1 + 소금·설탕. 20분 졸임.', tip:'설탕 한 꼬집이 산미를 부드럽게 만든다.'},
{title:'고추장 비빔 양념', body:'고추장 2 : 설탕 1 : 식초 1 : 참기름 1 : 다진마늘 0.5 : 통깨 0.5.', tip:'사이다 0.5 추가 시 청량한 단맛이 살아남.'},
{title:'미소·된장 양념', body:'된장 2 : 미림 1 : 설탕 0.5 : 다진마늘 0.5 : 참기름 0.5. 가지·연어 구이에.', tip:'오래 끓이면 향이 날아감, 마지막에 투입.'},
{title:'굴소스 볶음 베이스', body:'굴소스 2 : 간장 1 : 설탕 0.5 : 청주 1 : 다진마늘 1 + 후추. 중식풍 만능.', tip:'굴소스 자체가 짜므로 소금 추가 금지.'},
{title:'스리라차 마요', body:'마요 3 : 스리라차 1 : 라임즙 0.5 : 꿀 0.5. 포케·새우튀김·샌드위치에.', tip:'꿀 대신 연유 쓰면 더 진한 풍미.'},
{title:'바질 페스토', body:'바질 50g : 잣 30g : 마늘 1쪽 : 파마산 30g : 올리브유 100ml.', tip:'잣은 살짝 볶아야 고소함이 두 배.'},
{title:'토마토 살사', body:'토마토 4 : 양파 1 : 고수 0.5 : 라임즙 1 : 할라피뇨 0.5. 10분 절여 수분 빼기.', tip:'토마토 씨 제거해야 물기 없이 깔끔.'},
{title:'발사믹 드레싱', body:'올리브유 3 : 발사믹식초 1 : 디종머스타드 0.5 : 꿀 0.5 + 소금·후추.', tip:'머스타드 먼저 섞고 오일 천천히 넣어 유화.'},
{title:'그릭요거트 드레싱', body:'그릭요거트 3 : 레몬즙 1 : 올리브유 1 : 다진마늘 0.5 + 딜·소금.', tip:'오이 다져 넣으면 차지키 소스로 변신.'},
{title:'데미글라스 베이스', body:'버터 1 : 밀가루 1로 브라운 루 + 비프스톡 8 : 토마토페이스트 1 : 레드와인 2.', tip:'루가 밝으면 풍미 부족, 충분히 갈색까지.'}
]},
storage: {label: '📦 보관·데우기', items: [
{title:'냉장 vs 냉동', body:'조리 음식은 냉장 3~4일 이내, 그 이상은 냉동(2~4주). 4일+나머지 냉동으로 분배.', tip:'월·화·수·목 분량만 냉장, 금요일분은 냉동.'},
{title:'밥 한 김 식혀 소분', body:'갓 지은 밥을 평평하게 펴 한 김 식힌 뒤 1공기씩 랩이나 용기에. 냉동 2~3주.', tip:'뜨거울 때 밀봉하면 물맺힘으로 떡진다.'},
{title:'국·찌개는 한 번 더 끓여서', body:'조리 후 한 번 더 팔팔 끓여 식힌 뒤 냉장. 먹기 전에도 펄펄 끓여 데우기. 2~3일.', tip:'건더기·국물 따로 담으면 식감이 더 살아남.'},
{title:'볶음은 3~4일', body:'완전히 식힌 뒤 밀폐. 채소 볶음은 더 빨리 물이 생기니 2~3일 권장.', tip:'양념 진하게 하면 보존성·풍미 모두 상승.'},
{title:'샐러드는 드레싱 따로', body:'잎채소는 물기 완전히 제거 + 키친타월. 드레싱은 작은 용기에 따로.', tip:'토마토·오이는 별도 칸에 담아야 안 무름.'},
{title:'곡물 미리 익혀 소분', body:'한 번에 많이 삶아 1회분씩 소분. 냉장 4~5일, 냉동 1개월. 데울 때 물 1큰술.', tip:'기름 1방울 섞어 삶으면 알알이 안 뭉친다.'},
{title:'오버나이트 오츠 5일', body:'오트밀+우유+요거트는 냉장 5일까지. 과일은 2~3일치만 미리, 나머진 당일.', tip:'꿀·시럽은 먹기 직전, 미리 넣으면 묽어진다.'},
{title:'견과류 먹기 직전 토핑', body:'미리 섞으면 눅눅하고 산패. 작은 지퍼백에 1회분씩 따로.', tip:'견과는 냉동 보관해야 산패 늦춰진다.'},
{title:'유리 vs 플라스틱 용기', body:'전자레인지·식기세척기·냄새 걱정 없는 유리가 1순위. 휴대용은 BPA-free 플라스틱.', tip:'기름·김치는 무조건 유리, 플라스틱 변색 주의.'},
{title:'라벨링', body:'마스킹테이프에 메뉴+조리일을 적어 붙이면 묵힌 음식 사고 방지. 선입선출.', tip:'냉동은 조리일+해동기한까지 표기.'},
{title:'재가열 — 음식별 최적', body:'국·찌개=냄비, 볶음·구이=팬·에어프라이어, 밥·찜=전자레인지가 베스트.', tip:'전자레인지 사용 시 물 1큰술 + 뚜껑 살짝.'},
{title:'데우기 전 상온 5분', body:'냉장에서 바로 데우면 겉만 뜨겁고 속은 차갑다. 5분 후 가열하면 균일.', tip:'더운 날엔 3분 이내로만 짧게.'},
{title:'에어프라이어 바삭함', body:'튀김·구이·전류는 180도 3~5분이면 갓 만든 듯 바삭. 키친타월로 기름기 닦기.', tip:'물기 많은 음식은 호일 깔아야 안 들러붙는다.'},
{title:'식중독 예방', body:'조리 후 90분(여름 60분) 안에 식혀 냉장. 냉동식품은 전날 밤 냉장칸으로.', tip:'장마·한여름엔 실온 30분만 둬도 위험.'}
]},
trouble: {label: '🛟 문제 해결', items: [

{title:'음식이 너무 매울 때', body:'캡사이신은 물에 안 녹는다. 설탕·우유·플레인 요거트·두부로 중화.', tip:'고춧가루는 절반만 넣고 맛본 뒤 추가.'},
{title:'고기·생선 비린내', body:'생강·청주·우유에 10분 담그거나 끓일 때 대파 뿌리를 함께 넣는다.', tip:'조리 직전 키친타월로 핏물을 꼼꼼히 닦기.'},

{title:'면이 떡지거나 불었을 때', body:'뜨거운 물에 30초 헹구거나 참기름 한 방울로 다시 풀어준다.', tip:'삶은 즉시 찬물에 헹궈 전분기 제거.'},
{title:'찌개·카레가 너무 묽을 때', body:'뚜껑 열고 졸이거나 감자 으깬 것·전분물·밀가루 1스푼으로 농도 맞춤.', tip:'물은 처음부터 적게, 부족하면 추가.'},
{title:'양념장이 너무 묽을 때', body:'고춧가루·다진 마늘·물엿을 추가하면 농도와 감칠맛이 함께 살아난다.', tip:'간장과 물 비율을 미리 정해두고 시작.'},
{title:'마늘을 너무 많이 넣었을 때', body:'우유·설탕을 약간 넣고 충분히 끓여 매운 향을 날린다.', tip:'마늘은 1인분 기준 반 큰술부터 시작.'},
{title:'고기가 질길 때', body:'키위·배·파인애플즙에 20분 재우거나 결 반대 방향으로 얇게 썬다.', tip:'센 불에 겉만 익히고 잔열로 마무리.'},
{title:'밥이 너무 질거나 될 때', body:'질면 뚜껑 열고 약불로 수분 날리기. 되면 뜨거운 물 두 스푼 + 5분 뜸.', tip:'쌀과 물은 1:1.1 비율을 기본으로 기억.'},
{title:'채소가 시들었을 때', body:'얼음물에 10분 담가두면 세포가 다시 물을 흡수해 아삭함이 돌아온다.', tip:'젖은 키친타월에 싸서 냉장 보관.'},
{title:'반찬이 변색됐을 때', body:'데칠 때 소금 약간 + 찬물에 빠르게 헹궈 식히면 푸른빛이 유지된다.', tip:'참기름은 먹기 직전에 무치기.'},
{title:'보관 후 찌개 맛 밍밍', body:'다진 마늘·대파·들기름을 새로 추가하면 첫날의 풍미가 되살아난다.', tip:'한 번 먹을 양만 덜어 끓이면 맛 보존.'},

]}

function findTipsForText(text){
if(!text) return [];
const matched = new Set();
const result = [];
Object.entries(COOKING_TIPS).forEach(([catKey, cat]) => {
cat.items.forEach(tip => {
if(matched.has(tip.title)) return;
const keywords = TIP_KEYWORDS[tip.title];
if(!keywords || keywords.length === 0) return;
const hit = keywords.some(k => {
if(k.includes('.*')){
try{ return new RegExp(k).test(text); }catch(e){ return false; }
}
return text.includes(k);
});
if(hit){
matched.add(tip.title);
result.push({...tip, catKey, catLabel: cat.label});
}
});
});
return result;
}

function classifyCookingPhase(recipe){
const name = recipe.name || '';
const cookTime = recipe.cookTime || 0;
const type = recipe.type;
const ingText = (recipe.ingredients || []).join(' ');
if(/회 |포케|샐러드/.test(name) || /연어회|참치회|광어회/.test(ingText)) return 4;
if(cookTime >= 45 || /찜|스튜|개장|곰탕|전골|육수/.test(name)) return 1;
if(type === 'sheet-pan' || cookTime >= 25) return 2;
return 3;
}

  let lastTrail=0;
  document.addEventListener('mousemove',e=>{
    const now=Date.now();
    if(now-lastTrail<30)return;
    lastTrail=now;
    const dot=document.createElement('div');
    dot.className='cursor-trail';
    dot.style.left=e.clientX+'px';
    dot.style.top=e.clientY+'px';
    document.body.appendChild(dot);
    setTimeout(()=>dot.remove(),600);
  });
}

// 3D Tilt Cards
if(!('ontouchstart' in window)){
  document.addEventListener('mousemove',e=>{
    const card=e.target.closest('.recipe-card');
    if(!card)return;
    const rect=card.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;
    const rotateX=(y-rect.height/2)/12;
    const rotateY=(rect.width/2-x)/12;
    card.style.transform=`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-6px) scale(1.02)`;
  });
  document.addEventListener('mouseover',e=>{
    const card=e.target.closest('.recipe-card');
    if(!card||card._tiltBound)return;
    card._tiltBound=true;
    card.addEventListener('mouseleave',()=>{card.style.transform='';card._tiltBound=false;});
  });
}

  let iteration=0;
  const interval=setInterval(()=>{
    el.textContent=original.map((c,i)=>{
      if(c===' ')return ' ';
      if(i<iteration)return original[i];
      return chars[Math.floor(Math.random()*chars.length)];
    }).join('');
    if(iteration>=original.length)clearInterval(interval);
    iteration+=0.5;
  },40);
}
setTimeout(()=>scrambleText(document.querySelector('.header h1')),300);

// Magnetic Button
const magneticBtn=document.getElementById('regenerateBtn');
if(magneticBtn&&!('ontouchstart' in window)){
  magneticBtn.addEventListener('mousemove',e=>{
    magneticBtn.style.transition='none';
    const rect=magneticBtn.getBoundingClientRect();
    const x=e.clientX-rect.left-rect.width/2;
    const y=e.clientY-rect.top-rect.height/2;
    magneticBtn.style.transform=`translate(${x*0.3}px,${y*0.3}px)`;
  });
  magneticBtn.addEventListener('mouseleave',()=>{
    magneticBtn.style.transition='transform 0.4s ease';
    magneticBtn.style.transform='';
    setTimeout(()=>magneticBtn.style.transition='',400);
  });
}

// Confetti
function launchConfetti(){
  const colors=['#E74C3C','#F39C12','#2ECC71','#3498DB','#9B59B6'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'%';
    c.style.background=colors[Math.floor(Math.random()*5)];
    c.style.animationDelay=Math.random()*0.5+'s';
    c.style.animationDuration=(1.5+Math.random()*2)+'s';
    c.style.width=(6+Math.random()*8)+'px';
    c.style.height=(6+Math.random()*8)+'px';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4500);
  }
}
</script>

<button class="feedback-btn" onclick="document.getElementById('feedbackOverlay').classList.add('active')" aria-label="피드백 보내기">
<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
</button>

<div class="feedback-overlay" id="feedbackOverlay" onclick="if(event.target===this)this.classList.remove('active')">
<div class="feedback-modal">
<h3>피드백 보내기</h3>
<p>개선 사항이나 의견을 남겨주세요. 익명으로 전송됩니다.</p>
<textarea id="feedbackBody" placeholder="피드백 내용을 입력해주세요..." maxlength="2000" oninput="document.getElementById('charCount').textContent=this.value.length+'/2000'"></textarea>
<div class="char-count" id="charCount">0/2000</div>
<div class="turnstile-wrap" id="turnstileWrap"></div>
<div class="feedback-actions">
<button class="btn-cancel" onclick="closeFeedback()">취소</button>
<button class="btn-submit" id="feedbackSubmit" onclick="submitFeedback()">보내기</button>
</div>
<div class="feedback-status" id="feedbackStatus"></div>
</div>
</div>

<script>
let turnstileWidgetId;
function renderTurnstile(){
  if(typeof turnstile!=='undefined'&&!turnstileWidgetId){
    turnstileWidgetId=turnstile.render('#turnstileWrap',{sitekey:'0x4AAAAAADBIvWafxWnKEs21',theme:'light',size:'flexible'});
  }
}
const tObs=new MutationObserver(()=>{if(typeof turnstile!=='undefined'){renderTurnstile();tObs.disconnect()}});
tObs.observe(document.head,{childList:true,subtree:true});
setTimeout(()=>{renderTurnstile()},2000);

async function submitFeedback(){
  const body=document.getElementById('feedbackBody').value.trim();
  const status=document.getElementById('feedbackStatus');
  const btn=document.getElementById('feedbackSubmit');
  status.className='feedback-status';status.style.display='none';
  if(!body){status.textContent='내용을 입력해주세요';status.className='feedback-status error';status.style.display='block';return}
  const token=turnstile.getResponse(turnstileWidgetId);
  if(!token){status.textContent='인증 체크박스를 완료해주세요';status.className='feedback-status error';status.style.display='block';return}
  btn.disabled=true;btn.textContent='전송 중...';
  try{
    const res=await fetch('https://vpcozjkbossofcnarspv.supabase.co/functions/v1/create-issue',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({body,turnstile_token:token})
    });
    const data=await res.json();
    if(res.ok){
      status.textContent='피드백이 전송되었습니다. 감사합니다!';status.className='feedback-status success';status.style.display='block';
      document.getElementById('feedbackBody').value='';document.getElementById('charCount').textContent='0/2000';
      turnstile.reset(turnstileWidgetId);
      setTimeout(()=>closeFeedback(),2000);
    }else{
      status.textContent=data.error||'전송에 실패했습니다';status.className='feedback-status error';status.style.display='block';
      turnstile.reset(turnstileWidgetId);
    }
  }catch(e){
    status.textContent='네트워크 오류가 발생했습니다';status.className='feedback-status error';status.style.display='block';
  }finally{btn.disabled=false;btn.textContent='보내기'}
}
function closeFeedback(){
  document.getElementById('feedbackOverlay').classList.remove('active');
  document.getElementById('feedbackStatus').style.display='none';
}

// PWA — Service Worker 등록
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
